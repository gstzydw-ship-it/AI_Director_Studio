    source_rules:
      - "07:规则13"
      - "07:规则14"

  - id: "PROMPT-LIGHT-009"
    title: "光线一致性优先"
    owner_agent: "prompt_compiler"
    priority: "P1"
    applies_when: "提示词描述场景光线、风格、时间和氛围。"
    instruction: "光线比空泛形容词更重要；不得出现冷暖、方向、强弱或风格互相矛盾的光线描述。"
    avoid_when: "确有双光源或舞台式光线时，必须明确主光和辅助光关系。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "07:规则17"
      - "07:规则18"
      - "07:规则19"

  - id: "RHYTHM-BEAT-001"
    title: "片段内部先判断节拍功能"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "改写或组织片段内部时间轴。"
    instruction: "先判断当前节拍是建立、预压、逼近、炸点、受击、压入、停顿还是收束，再决定节奏写法。"
    avoid_when: "纯技术编译阶段，节拍已由上游明确给出。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:规则01"

  - id: "RHYTHM-EVENT-002"
    title: "事件关系模型"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "同一片段内有多个事件、动作或信息点。"
    instruction: "必须判断事件之间是并列、递进、打断还是压入，并据此组织节拍顺序。"
    avoid_when: "只有单一动作单元且没有新信息进入。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:规则03"
      - "15:规则04"

  - id: "RHYTHM-WEIGHT-003"
    title: "节拍长短服务戏剧重量"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "需要安排停顿、反应、解释或推进速度。"
    instruction: "节拍长短必须服从戏剧重量；炸点后不要急着解释完，受击段先写人怎么被击中。"
    avoid_when: "低权重过场信息，不应过度停顿。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:规则07"
      - "15:规则12"
      - "15:规则13"

  - id: "RHYTHM-ASL-001"
    title: "ASL 级差跳跃"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "15 秒片段内部需要形成观看节奏变化。"
    instruction: "每个 15 秒片段内部的平均镜头时长应至少出现一次级差跳跃，避免全程同速。"
    avoid_when: "单镜头长动作片段需要连续呈现，可用内部动作节拍替代剪辑级差。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:R-01"

  - id: "RHYTHM-ASL-002"
    title: "微短剧 ASL 基准"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "评估微短剧片段整体剪辑密度。"
    instruction: "微短剧整体 ASL 基准锚定在 1.5-3.5 秒，但不得把全程高能当成默认美学。"
    avoid_when: "建立空间、长情绪停顿或复杂动作需要更长镜头。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:R-02"
      - "15:R-03"

  - id: "RHYTHM-REACTION-MIN-001"
    title: "反应镜头最低停留"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "信息揭示、受击、反转或人物情绪被击中后。"
    instruction: "剧情受击型反应镜头最低停留 1.5 秒，重要信息可保留 1.5-2.5 秒回味。"
    avoid_when: "只是剪辑遮挡型听者补帧，可交由 shot_director 按 CUT-REACTION-001 缩短。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:R-04"
      - "15:R-05"

  - id: "MOTION-RHYTHM-001"
    title: "固定机位也是强决策"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "判断节拍是否需要运镜介入。"
    instruction: "先判断是否需要运镜，再判断用什么运镜；固定机位本身可以表达压迫、稳定、权力或停顿。"
    avoid_when: "人物运动、注意力转移或新事件压入需要摄影机带动观众视线。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:规则01"
      - "15:规则02"

  - id: "MOTION-RHYTHM-002"
    title: "运镜必须绑定节拍功能"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "推、拉、跟随、横移、摇摄等运镜进入时间轴。"
    instruction: "运镜介入必须与建立、预压、逼近、炸点、受击、压入、停顿或收束等节拍功能绑定。"
    avoid_when: "只是为了电影感或画面变化而添加运镜。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:规则03"
      - "15:规则22"

  - id: "MOTION-RHYTHM-003"
    title: "停顿段通常不动"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "黄金停顿、反应停顿、信息回味或关系断裂后的空白。"
    instruction: "停顿段通常不动，先稳住人物反应和观众消化，不用运镜抢情绪。"
    avoid_when: "停顿同时承担注意力转移或新事件压入。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:规则10"
      - "15:规则19"

  - id: "EMOTION-ANCHOR-001"
    title: "每个时间段必须有情绪锚点"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "每个时间段、主分镜或关键动作段输出时。"
    instruction: "每个时间段至少写一个可见情绪表现锚点，如眼神、呼吸、停顿、手部动作或姿态变化。"
    avoid_when: "纯环境空镜或道具特写，但也应通过环境反应承接情绪。"
    source_files:
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "18:规则01"

  - id: "EMOTION-ANCHOR-002"
    title: "禁止空泛情绪词独立使用"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "提示词中出现震惊、害怕、愤怒、悲伤、暧昧等情绪词。"
    instruction: "情绪词必须落到可见表演动作或身体反应，不得单独作为模型执行指令。"
    avoid_when: "无例外；抽象情绪必须翻译成可拍动作。"
    source_files:
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
      - "knowledge/14_动作描述精细化控制规则.md"
    source_rules:
      - "18:规则02"
      - "18:规则03"

  - id: "PROMPT-NOSUBTITLE-001"
    title: "对白禁止字幕文字"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "最终 Seedance prompt、质检或交付结果中包含对白、口播、台词引号、字幕、屏幕文字、英文字幕、文字浮层或 timeline pollution 风险。"
    instruction: "约束段必须明确禁止字幕、屏幕文字、英文字幕和文字浮层；台词只作为声音或口型存在。"
    avoid_when: "无例外；如需屏幕内道具文字，必须由用户显式要求且与对白字幕区分。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/17_结果质检与回溯修正规则.md"
    source_rules:
      - "07:规则10-2"
      - "17:检查项11"

  - id: "ACTION-COLLISION-001"
    title: "意外碰撞反浪漫化"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "剧本动作是冲入、撞上、扑到、失衡、阻拦或意外身体接触。"
    instruction: "只写短促失衡、稳住手臂/腰侧、重心被拉回和距离恢复；不得写怀里、拥抱、贴身、胸口或亲密对视。"
    avoid_when: "原剧本明确要求拥抱、亲密对视或浪漫肢体互动。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/17_结果质检与回溯修正规则.md"
    source_rules:
      - "06:规则12-3"
      - "17:检查项11"

  - id: "WORKFLOW-SEGMENT-001"
    title: "默认逐段交互工作流"
    owner_agent: "story_planner"
    priority: "P0"
    applies_when: "项目采用逐段生成、上一段尾帧、视频末帧、prev_tailframe 续接下一段的工作流；下一段首帧继承连续性，不能反向重算已锁定拆片骨架、主分镜边界或完整发言单元。"
    instruction: "默认按逐段交互执行：先完成当前片段，再基于尾帧或视频分析续接下一片段；尾帧只服务下一段首帧继承和连续性续接，不回头重拆已锁定片段。"
    avoid_when: "用户明确要求一次性全片规划，或没有逐段生成能力。"
    source_files:
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "18:规则06"
      - "18:规则09"

  - id: "WORKFLOW-TAILFRAME-002"
    title: "尾帧分析覆盖连续性要素"
    owner_agent: "quality_inspector"
    agent_scope:
      - "story_planner"
    priority: "P1"
    applies_when: "上一段生成后需要分析尾帧或视频末帧，并用于下一段首帧继承、连续性续接和不重拆片判断。"
    instruction: "尾帧或视频分析必须覆盖人物位置、动作状态、道具、光线、视线、镜头方向和可继承风险；分析只服务下一段首帧总控与连续性继承，不得反向修改已锁定的拆片骨架、主分镜边界或完整发言单元。"
    avoid_when: "上一段完全失败，应进入返工而不是续接；除非用户明确要求重新拆片、重算边界或重做片段规划，否则不得用尾帧触发重拆。"
    source_files:
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "18:规则07"
      - "18:规则07-1"
      - "18:规则08"
      - "05:规则15-1"
      - "07:规则07-1"

  - id: "CONTINUITY-LOWANGLE-001"
    title: "仰拍限制"
    owner_agent: "quality_inspector"
    agent_scope:
      - "shot_director"
    priority: "P1"
    applies_when: "镜头计划中出现仰拍、低机位、低角度、低视角、low angle、low-angle shot、俯拍、高机位、high angle、平视机位、eye level 或权力高度表达。"
    instruction: "默认机位高度为平视/eye level；仰拍、低位仰拍、略仰视角、low camera angle 只允许在穷举合法场景中使用，一个 15 秒片段最多 1 次；俯拍/high angle 也必须有叙事理由。"
    avoid_when: "儿童、脆弱姿态、地面倒伏、私密身体凝视或模型稳定性不足。"
    source_files:
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "18:规则10"
      - "18:规则11"
      - "18:规则12"
      - "18:规则13"
      - "18:规则14"

  - id: "CONT-PROP-TIMELINE-001"
    title: "道具状态时间线"
    owner_agent: "quality_inspector"
    priority: "P1"
    applies_when: "同一片段或跨片段中角色持物、放物、递物、使用道具。"
    instruction: "约束段必须写明道具状态时间线；单手持物变双手做事时必须写过渡。"
    avoid_when: "道具已经离场或剧情明确丢弃。"
    source_files:
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "18:规则17"
      - "18:规则18"
      - "18:规则19"

  - id: "MULTICAM-NOSTATIC-001"
    title: "禁止呆板正反打默认方案"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "双人对话、对峙或信息交换场景。"
    instruction: "不得默认全程正反打，应按建立、关系、反应、细节和压缩需求组合镜头菜单。"
    avoid_when: "极短发言确认身份时可短暂使用正反打，但不能成为整段默认方案。"
    source_files:
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
    source_rules:
      - "22:规则01"
      - "22:规则02"

  - id: "MULTICAM-ONECAMERA-002"
    title: "AI 多机位生成片段单机位连续拍摄"
    owner_agent: "shot_director"
    agent_scope:
      - "shot_director"
      - "shot_director_layout"
      - "prompt_compiler"
    priority: "P1"
    applies_when: "AI 多机位分镜中，同一动作需要多个角度覆盖，但每个生成片段只能一个机位连续拍摄，单段只保留一两个连贯动作。"
    instruction: "每个生成片段只落在一个机位/镜头类型上并保持连续拍摄；需要多个角度覆盖时，拆成多个生成片段、主分镜或子分镜，并用动作锚点、台词落点、受击反应或视线触发衔接。"
    avoid_when: "15 秒导演片段内部已经按 MULTICAM-MULTISHOT-002 规划为有动机的主分镜/子分镜切换时，不把整条 15 秒片段误压成单一机位；最终 prompt 仍只写单层时间轴。"
    query_terms:
      - "AI 多机位分镜"
      - "同一动作 多个角度覆盖"
      - "每个生成片段 一个机位 连续拍摄"
      - "单段 一两个 连贯动作"
      - "single camera per generated clip"
    signals:
      - "多机位覆盖"
      - "一个机位"
      - "连续拍摄"
      - "生成片段"
      - "单段动作限制"
    source_files:
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
    source_rules:
      - "22:流程C"
      - "22:规则05"
      - "22:一句话总纲"

  - id: "MULTICAM-MULTISHOT-002"
    title: "15 秒导演片段内部保留主分镜/子分镜，最终只写单层时间轴"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "把多机位方案转成 AI 视频生成片段。"
    instruction: "一个 15 秒导演片段内部可以包含多个主分镜/子分镜；最终 Seedance prompt 只写普通时间段，不显式输出主分镜/子分镜标签。"
    avoid_when: "外层动作单元 + 内层子时间轴、多个分镜共享同一时间标记、两个相同景别直接相接，或把整条 15 秒片段误压成单一机位。"
    source_files:
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
      - "knowledge/00_知识库优先级与冲突裁决规则.md"
    source_rules:
      - "22:规则04"

  - id: "PROMPT-MAIN-SUBSHOT-TIMELINE-001"
    title: "主分镜与子分镜是内部结构，最终输出只写单层时间轴"
    owner_agent: "prompt_compiler"
    priority: "P1"
    applies_when: "编译最终 Seedance prompt，尤其是需要主分镜加子分镜时。"
    instruction: "内部主分镜和子分镜必须映射为同一条时间轴上的普通时间段，每段有独立时间；最终 prompt 不写主分镜/子分镜标签。插入段必须服务上一动作起始镜头或当前动作锚点，并且与前后镜头形成景别、机位或功能差异。"
    avoid_when: "最终 prompt 出现主分镜/子分镜标签；外层动作单元 + 内层子时间轴；无功能硬切；特写接特写、半身中景接半身中景等相同景别直切；把插入段误拆成新剧情事件。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-MAIN-SUBSHOT-TIMELINE-001.md"
      - "knowledge/00_知识库优先级与冲突裁决规则.md"
    source_rules:
      - "PROMPT-MAIN-SUBSHOT-TIMELINE-001"

  - id: "MULTICAM-ACTIONLIMIT-003"
    title: "单段只描述 1-2 个连贯动作"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "AI 视频生成片段包含人物动作、摄影机运动和多角色互动。"
    instruction: "单段只描述 1-2 个连贯动作，复杂动作拆成多个片段或多机位覆盖。"
    avoid_when: "无例外；复杂度超限优先拆动作而不是堆提示词。"
    source_files:
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "22:规则05"

  - id: "MULTICAM-REFERENCE-004"
    title: "人物参考图保障多机位一致性"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "同一人物需要跨多个机位或多个生成片段保持一致。"
    instruction: "人物参考图是多机位一致性的关键，必须稳定绑定角色身份、外观和服装，不随机替换称谓。"
    avoid_when: "没有可用参考图时，必须用文字约束降低外观漂移。"
    source_files:
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "22:规则06"

  - id: "MULTICAM-ERRORREDUCE-005"
    title: "利用机位切换减少模型出错"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "动作过程冗长、走路填时长、复杂转身或模型容易漂移。"
    instruction: "用机位切换省略垃圾时间和高风险动作过程，把每段保留在模型更容易稳定生成的动作范围内。"
    avoid_when: "切换会破坏动作锚点、方向连续或主分镜骨架。"
    source_files:
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
    source_rules:
      - "22:规则07"

  - id: "RHYTHM-SIGNAL-TAXONOMY-001"
    title: "短剧戏剧微粒识别表"
    owner_agent: "story_planner"
    priority: "P2"
    applies_when: "story_planner 拆片前需要判断片段的主戏剧微粒、Hook 权重、受击空间和边界原因。"
    instruction: "先识别主戏剧微粒，再输出 rhythm_function、hook_weight、script_basis、boundary_reason 和 reaction_need；每个片段最多保留 1 个主信号和 1 个次级信号，不得提前下镜头执行指令。"
    avoid_when: "不得在 story_planner 阶段提前写具体景别、机位或运镜。"
    source_files:
      - "knowledge/24_戏剧微粒识别与节奏触发规则.md"
      - "knowledge/15_故事节奏控制规则.md"
      - "knowledge/rules/story_planner/RHYTHM-SIGNAL-TAXONOMY-001.md"
    source_rules:
      - "report:交付物二"

  - id: "SHOT-RHYTHM-SIGNAL-MAPPING-001"
    title: "节奏信号到镜头语言映射"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "shot_director 已收到上游 rhythm_function，需要把节奏功能转成镜头语言。"
    instruction: "根据节奏信号决定镜头压力、受击窗口、Micro-Pause、尾帧阻断和关系收束方式，并说明 shot_language_reason、rhythm_basis、script_basis 和 why_not_template。"
    avoid_when: "没有 script_basis 的片段不得套用高能爆点镜头。"
    source_files:
      - "knowledge/24_戏剧微粒识别与节奏触发规则.md"
      - "knowledge/15_故事节奏控制规则.md"
      - "knowledge/rules/shot_director/SHOT-RHYTHM-SIGNAL-MAPPING-001.md"
    source_rules:
      - "report:交付物三"
      - "report:交付物四"

  - id: "SHOT-COMPLEX-ACTION-DEGRADE-001"
    title: "复杂物理动作必须蒙太奇降级"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "剧本出现击打、推搡、抢夺、多人混乱、倒地、强拉强拽或高风险身体接触。"
    instruction: "不得把完整物理接触塞进一个镜头；拆为动作前摇、冲击切出、受击反应和结果暗示，优先用反应与声音补偿真实碰撞。"
    avoid_when: "简单低风险动作可按普通动作锚点处理，但仍遵守一镜一主动作。"
    source_files:
      - "knowledge/rules/shot_director/SHOT-COMPLEX-ACTION-DEGRADE-001.md"
    source_rules:
      - "report:交付物三"
      - "report:深度解剖案例1"

  - id: "SHOT-DIALOGUE-PAUSE-001"
    title: "长对白必须切出气口"
    owner_agent: "shot_director"
    priority: "P0"
    applies_when: "单句对白超过 15 个中文字符、预计发音超过 4 秒、高压对白连续密集出现、长对白需要停顿气口、听者反应、reaction、道具插入或关系镜头。"
    instruction: "只在原文标点或完整短语边界拆分对白，并插入 1.0-2.5 秒听者反应、道具插入或停顿气口；拼回后必须与原对白一致。"
    avoid_when: "短促低权重对白不应被过度切碎。"
    source_files:
      - "knowledge/rules/shot_director/SHOT-DIALOGUE-PAUSE-001.md"
    source_rules:
      - "report:交付物四"
      - "report:Rule Card RC_01"

  - id: "PROMPT-CONSTRAINT-POLARITY-001"
    title: "约束集中写入且时间轴正向表达"
    owner_agent: "prompt_compiler"
    priority: "P0"
    applies_when: "最终 prompt 同时包含硬约束、时间轴、对白、人物、场景连续性、零亲密接触、物理距离、扶腰、贴身、怀里、极近脸距、角色名、站位、朝向、可见距离、规则解释、心理分析、禁止字幕、保持轴线不变或禁忌复读要求。"
    instruction: "硬约束集中写入【核心禁忌】或【约束】；时间轴内部只写画面内可见动作、运镜、调度、表情变化和对白声音，用正向可见状态表达角色名、站位、朝向和可见距离，不在每段末尾重复禁忌串。"
    avoid_when: "含对白时仍必须保留禁止字幕与屏幕文字的最终硬约束句。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-CONSTRAINT-POLARITY-001.md"
    source_rules:
      - "report:交付物八"

  - id: "PROMPT-AXIS-LOCK-PER-SEGMENT-001"
    title: "单片段内摄影机必须始终在 180° 轴线同侧"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "编译或质检最终 Seedance prompt，单段内同时出现多个机位描述、双人关系镜头、反打需求、轴线、180°、尾帧延续、摄影机同侧或跨轴风险。"
    instruction: "每个 segment 必须在开头明确轴线方向并选定摄影机一侧（左/中/右），整段 prompt 内不得跨到另一侧；真要反打必须由 story_planner 拆段，并通过人物自然转身、越轴中性镜头或 scene_fixed 机位作为过渡。"
    avoid_when: "单段出现人物相对的“左前方/右前方/左后方/右后方”、单段出现“反打至/反打镜头/翻拍至”、用“同一机位继续”承接反向机位描述。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-AXIS-LOCK-PER-SEGMENT-001.md"
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "PROMPT-AXIS-LOCK-PER-SEGMENT-001"

  - id: "PROMPT-CUT-BUDGET-001"
    title: "单片段切镜预算（含隐性切镜识别）"
    owner_agent: "prompt_compiler"
    priority: "P0"
    applies_when: "编译最终 Seedance prompt，需要在单段内安排多个镜头变化、机位切换或主体焦点切换。"
    instruction: "按 segment 时长执行切镜预算：≤3 秒禁止切镜；3-8 秒最多 1 次；8-13 秒最多 2 次；13-15 秒最多 3 次。超出预算必须由 story_planner 重新拆段，禁止 compiler 自行硬塞或缩短时长绕开预算。识别“同一机位继续”后 60 字内若引入新主体名+新景别（中景/特写/中近景等）即判为隐性切镜并算入总数。"
    avoid_when: "用“同一机位继续/镜头保持/机位不变”作为隐性切镜的伪装；把超过预算的事件全塞进单段；通过缩短 segment 时长来绕开预算上限。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-CUT-BUDGET-001.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/rules/prompt_compiler/PROMPT-CINEMATIC-DOWNTRANSLATION-002.md"
    source_rules:
      - "PROMPT-CUT-BUDGET-001"

  - id: "PROMPT-FIRST-FRAME-PIXEL-LOCK-001"
    title: "首帧锁必须含像素锚点（不只人物相对位置）"
    owner_agent: "prompt_compiler"
    priority: "P0"
    applies_when: "编译最终 Seedance prompt 的【空间与首帧总控】段，或写 scene_lock.first_frame_lock / main_shots[0].first_frame 字段。"
    instruction: "首帧描述必须同时包含至少 2 类像素锚点（A 主体像素位置 / B 背景锚点像素位置 / C 构图比例），例如“画面中央”“占画面高度 1/2”“胸口对齐画面纵向 1/2 处”“电梯门框位于画面远端中央”等；前一段尾帧像素描述与下一段首帧像素描述必须逐字对齐。"
    avoid_when: "只写“X 位于中轴入口方向”这种纯人物相对场景的描述；只写“X 在画面前方/后方”这种深度方向无像素锚的描述；首帧锚点和后续段尾帧锚点用不同的像素描述体系。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-FIRST-FRAME-PIXEL-LOCK-001.md"
      - "knowledge/11_场景分析输入卡与导演意图提取.md"
      - "knowledge/rules/scene_analyst/SCENE-CONSISTENCY-LOCK-001.md"
      - "knowledge/rules/prompt_compiler/REF-TAILFRAME-PRIORITY-001.md"
    source_rules:
      - "PROMPT-FIRST-FRAME-PIXEL-LOCK-001"

  - id: "QC-PACING-SAFETY-CHECKLIST-001"
    title: "节奏与物理安全质检清单"
    owner_agent: "quality_inspector"
    priority: "P0"
    applies_when: "quality_inspector 检查 shot_director 或 prompt_compiler 输出。"
    instruction: "逐项检查对白完整性、首镜 Hook、首 3 秒空转、连续长镜头、高潮对白密度、受击窗口、单镜上限、复杂动作同镜风险、约束污染和 Cliffhanger 释怀问题；失败时给出具体返修方向。"
    avoid_when: "不得只输出笼统的“节奏不好”或“需优化”。"
    source_files:
      - "knowledge/24_戏剧微粒识别与节奏触发规则.md"
      - "knowledge/15_故事节奏控制规则.md"
      - "knowledge/rules/quality_inspector/QC-PACING-SAFETY-CHECKLIST-001.md"
    source_rules:
      - "report:交付物八"

  - id: "RHYTHM-HOOK-OPEN-3S-001"
    title: "首镜 Hook 三秒释放"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "片段开头承担开场钩子、段落钩子或高权重重新抓人任务。"
    instruction: "首镜前 3 秒内必须至少释放高价值信息、关系压力、动作启动或明显情绪信号中的一项；不得把真正的钩子拖到第 4 秒以后。"
    avoid_when: "仅在纯空间继承镜头中可短暂降级，但仍需尽快补上关系、目标物或危险源。"
    source_files:
      - "knowledge/24_戏剧微粒识别与节奏触发规则.md"
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:R-09"

  - id: "SEGMENT-SIGNAL-BOUNDARY-001"
    title: "拆片先判主戏剧微粒与边界理由"
    owner_agent: "story_planner"
    priority: "P2"
    applies_when: "story_planner 在决定片段边界、受击空间和尾拍收束方式之前。"
    instruction: "先判断主戏剧微粒与 Hook 权重，再围绕命中点、受击点、黄金停顿或阻断点决定边界；高权重信号优先于平均时长。"
    avoid_when: "不得先按秒数切开，再回头给片段套节奏名字。"
    source_files:
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
      - "knowledge/24_戏剧微粒识别与节奏触发规则.md"
      - "knowledge/rules/story_planner/RHYTHM-SIGNAL-TAXONOMY-001.md"
    source_rules:
      - "05:15-2"
      - "05:15-3"

  - id: "RHYTHM-SIGNAL-REWRITE-001"
    title: "改写层按戏剧微粒组织 atmosphere_strategy"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "rhythm_rewrite_director 需要把动作层与氛围层改写成下游可执行的节拍建议时。"
    instruction: "先识别主戏剧微粒，再决定 atmosphere_strategy 如何建议停顿、受击、揭示前半拍、权力翻面证据和 Cliffhanger 阻断；只建议，不越权写镜头命令。"
    avoid_when: "不得臆造新人物、新事件、新道具，也不得改写原剧本台词。"
    source_files:
      - "knowledge/09_节奏总控与剧本改写规则.md"
      - "knowledge/24_戏剧微粒识别与节奏触发规则.md"
      - "knowledge/rules/rhythm_rewrite_director/RHYTHM-SIGNAL-REWRITE-001.md"
    source_rules:
      - "09:18"
      - "09:19"
      - "09:20"
      - "09:21"
      - "09:22"

  - id: "RHYTHM-CUTTING-TEMPO-HANDOFF-002"
    title: "快切、慢叙述与弹性片段时长交接"
    owner_agent: "rhythm_rewrite_director"
    agent_scope:
      - "story_planner"
      - "shot_director"
      - "quality_inspector"
    priority: "P0"
    applies_when: "节奏总控需要把哪里快切、哪里慢停、哪里用长镜头、哪里允许短段明确传给拆片和镜头导演。"
    instruction: "给下游只输出任务清单，不输出解释段落；必须包含 segment_duration_policy、story_planner_tasks、shot_director_tasks 和 quality_check_tasks。每条任务写清秒数、边界、保留事件、省略事件、切点、反应归属和尾帧状态。story_planner_tasks 要写是否拆 4-10 秒短段、short_segment_reason、keep_events、omit_events；shot_director_tasks 要写快切如何进行：2-3 个镜头、每镜 1-2 秒、动作 50%-70% 切出、下一镜从 30%-50% 接续、切受击者/关键道具/动作结果；慢叙述如何进行：1 个稳定主镜头、必要时 1 个反应镜头、主停顿 1.5-3 秒、只拍呼吸/视线/姿态/道具状态变化。普通段仍优先 13-15 秒，高密度快切、钩子阻断、动作压入或切镜预算超载时允许 4-10 秒短段。"
    avoid_when: "禁止只写“快/慢/电影感/更紧张”；禁止把快切误写成快速运镜+快速动作+复杂背景三快叠加；禁止把慢叙述写成空镜拖时长或无信息慢走；禁止切断完整发言单元。"
    source_files:
      - "knowledge/rules/rhythm_rewrite_director/RHYTHM-CUTTING-TEMPO-HANDOFF-002.md"
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
      - "knowledge/15_故事节奏控制规则.md"
      - "knowledge/rules/shot_director/SHOT-RHYTHM-SIGNAL-MAPPING-001.md"
      - "knowledge/rules/prompt_compiler/PROMPT-CUT-BUDGET-001.md"
    source_rules:
      - "RHYTHM-CUTTING-TEMPO-HANDOFF-002"

  - id: "RHYTHM-MICRO-PAUSE-001"
    title: "高压段必须切出 Micro-Pause"
    owner_agent: "shot_director"
    priority: "P3"
    applies_when: "密集语言对峙、真相揭晓、情绪临界、误会加深或反转命中前后。"
    instruction: "每轮关键台词交锋之间，必须插入 1.0-2.5 秒的反应镜头、关系镜头、道具插入或沉默停顿，让观众完成理解、受击和期待下一击。"
    avoid_when: "禁止用无意义走路、转身、空镜旅游或泛泛慢推冒充停顿。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
      - "knowledge/rules/shot_director/SHOT-DIALOGUE-PAUSE-001.md"
      - "knowledge/rules/quality_inspector/QC-PACING-SAFETY-CHECKLIST-001.md"
    source_rules:
      - "15:R-11"

  - id: "QC-FIRST-SHOT-4S-001"
    title: "首镜超过四秒的节奏报警"
    owner_agent: "quality_inspector"
    priority: "P0"
    applies_when: "高权重片段的首镜超过 4 秒，且尚未释放 Hook。"
    instruction: "若首镜超过 4 秒仍停留在空转、解释或中性站位，默认判为 fail，并要求缩首镜或提前释放高价值信息。"
    avoid_when: "只有纯空间继承、且无法更早给出关系或危险线索时，才允许降为 warn。"
    source_files:
      - "knowledge/17_结果质检与回溯修正规则.md"
      - "knowledge/rules/quality_inspector/QC-PACING-SAFETY-CHECKLIST-001.md"
    source_rules:
      - "17:12"

  # ========== shot_director_blocking 规则 ==========

  - id: "BLOCKING-PARENT-SUBSHOT-001"
    title: "子分镜必须挂靠 parent_shot_id"
    owner_agent: "shot_director_blocking"
    priority: "P1"
    applies_when: "动作调度导演在已有主分镜骨架上补充子分镜时。"
    instruction: "每个 sub_shot 必须包含 parent_shot_id 字段，且必须指向当前片段内已存在的 shot_id；不允许出现漂浮子分镜。"
    avoid_when: "无例外；漂浮子分镜在下游编译和质检中会被视为结构错误。"
    source_files:
      - "knowledge/26_动作调度与受击覆盖规则.md"
    source_rules:
      - "26:三、sub_shots 规则"

  - id: "BLOCKING-REACTION-COVERAGE-002"
    title: "reaction_coverage 必须明确落到主镜头或子镜头"
    owner_agent: "shot_director_blocking"
    priority: "P2"
    applies_when: "动作调度导演为每个片段补齐 reaction_coverage 时。"
    instruction: "reaction_coverage 必须明确写出受击或信息冲击落在当前片段的哪个 shot_id；不允许写“有受击反应”而不给出具体落点。"
    avoid_when: "纯环境交代片段可以写“无需受击覆盖”，但必须显式声明。"
    source_files:
      - "knowledge/26_动作调度与受击覆盖规则.md"
    source_rules:
      - "26:二、reaction_coverage 写法"

  - id: "BLOCKING-DIALOGUE-FIDELITY-003"
    title: "对白只允许引用原剧本，不得补写"
    owner_agent: "shot_director_blocking"
    priority: "P1"
    applies_when: "动作调度导演在补齐对白落点和 dialogue_coverage 时。"
    instruction: "dialogue_coverage 只能引用原始剧本中的台词原文；不允许缩写、改写、意译或新增剧本中没有出现过的台词。"
    avoid_when: "无例外；凡带引号的台词都必须能在原剧本中逐字找到。"
    source_files:
      - "knowledge/26_动作调度与受击覆盖规则.md"
      - "knowledge/04_对白与表演镜头规则.md"
    source_rules:
      - "26:四、对白覆盖原则"

  - id: "BLOCKING-CUT-ANCHOR-TIMING-004"
    title: "子分镜切镜必须有动作或信息锚点"
    owner_agent: "shot_director_blocking"
    priority: "P1"
    applies_when: "动作调度导演在已有主镜头下新增 sub_shots、reaction_coverage 或 dialogue_coverage。"
    instruction: "新增子分镜必须命中动作、视线、信息、权力或声音锚点；动作匹配剪辑切在中间态；承担命令、威胁、揭示的完整发言单元不要被无信息增量的脸部特写打碎。"
    avoid_when: "如果只是眉头、眼神或表情微变，优先留在父级主镜头内表演，不新增子分镜。"
    source_files:
      - "knowledge/26_动作调度与受击覆盖规则.md"
      - "knowledge/28_全场景分镜与转场案例库.md"
    source_rules:
      - "26:七、从 28 号案例库提炼的切镜与子分镜纪律"

  - id: "BLOCKING-STATE-DELTA-005"
    title: "动作调度必须写状态推进和切点"
    owner_agent: "shot_director_blocking"
    priority: "P1"
    applies_when: "动作调度导演补齐 main_shots 的状态推进，或新增 sub_shots 承接动作、台词、视线、手部、门/道具状态。"
    instruction: "每个主镜头补 state_delta；每个子分镜补 cut_point、companion_visibility 和 state_delta。状态必须单向推进，切点必须绑定台词落点、动作中间态、视线撞上或动作顶点前。"
    avoid_when: "如果状态确实不变，也必须写“保持”，避免下游误造变化。"
    source_files:
      - "knowledge/26_动作调度与受击覆盖规则.md"
      - "knowledge/03_镜头切换与推进规则.md"
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/20_镜头库与机位库.md"
    source_rules:
      - "26:八、全库检索后补入的覆盖执行字段"

  - id: "BLOCKING-ACTION-FLOW-006"
    title: "动作导演必须交付动作流程表与事件覆盖表"
    owner_agent: "shot_director_blocking"
    priority: "P0"
    applies_when: "动作调度导演需要把一号主分镜骨架翻译成可执行动作流程；对峙、压迫、受击、reaction_coverage、shot_id、子分镜、parent_shot_id、对白落点、多人散开、门口/电梯阈值段、闭环收束等片段。"
    instruction: "每个 fragment 至少补齐 blocking_plan、state_chain、event_coverage；state_chain 要把手、门、道具、站位、距离、群体状态写成单向变化链；event_coverage 要逐条把 source_script_events、受击反应、对白落点挂到具体 shot_id 或 parent_shot_id。若存在 sub_shots，还必须补 duration_hint 与 action_phase，避免把短重音写成新的主镜头。"
    avoid_when: "不得为了补这几张表重做 layout，不得改 shot_id 编号，不得新造剧本外事件。"
    source_files:
      - "knowledge/26_动作调度与受击覆盖规则.md"
      - "knowledge/28_全场景分镜与转场案例库.md"
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/rules/shot_director_blocking/BLOCKING-ACTION-FLOW-006.md"
    source_rules:
      - "26:九、动作导演必须交付三张表"

  # ========== shot_director_guard 规则 ==========

  - id: "GUARD-MINIMAL-REPAIR-001"
    title: "只修硬伤，不重写方案"
    owner_agent: "shot_director_guard"
    priority: "P0"
    applies_when: "规则守门导演审查前两位导演的产出，决定是否修改时；repair only hard injuries, break downstream, fail QC, do not rewrite camera idea, add new shots, reorder creativity, looks better。"
    instruction: "只修复会导致下游报错或质检 fail 的硬伤；不重写镜头创意、不另起炉灶、不新增镜头、不重排创意，不因为看起来更好就改方案。"
    avoid_when: "无例外；如果前两位导演的方案没有硬伤，守门导演的输出应当与输入几乎一致。"
    source_files:
      - "knowledge/27_规则守门与最小修复规则.md"
    source_rules:
      - "27:三、最小修复原则"

  - id: "GUARD-STRUCTURE-PRESERVE-002"
    title: "优先保留主结构与编号"
    owner_agent: "shot_director_guard"
    priority: "P2"
    applies_when: "规则守门导演修复镜头方案时，需要决定是否改动 fragment_id、shot_id 或 main_shots 结构。"
    instruction: "fragment_id 顺序不变、shot_id 保持前两位导演给出的编号、已有的 main_shots 除非存在严重结构错误否则保留。"
    avoid_when: "只有当 shot_id 存在真正冲突（重复编号、指向错误）时，才允许最小范围重编。"
    source_files:
      - "knowledge/27_规则守门与最小修复规则.md"
    source_rules:
      - "27:四、结构保持规则"

  - id: "GUARD-FIDELITY-VERTICAL-003"
    title: "优先修复剧本忠实度与竖屏纪律"
    owner_agent: "shot_director_guard"
    priority: "P1"
    applies_when: "规则守门导演发现多类问题时，需要决定修复优先级。"
    instruction: "剧本外元素必须立即删除；9:16 竖屏下一个片段内不允许所有主镜头都是面部特写，特写型主镜头最多 1 个。"
    avoid_when: "16:9 横屏画幅下特写限频可适当放宽，但剧本忠实度规则无例外。"
    source_files:
      - "knowledge/27_规则守门与最小修复规则.md"
      - "knowledge/02_焦段景深与景别画幅策略.md"
    source_rules:
      - "27:六、竖屏纪律守门"

  - id: "GUARD-SPATIAL-RESET-BUDGET-004"
    title: "必须修复空间重置和特写偷时间"
    owner_agent: "shot_director_guard"
    priority: "P1"
    applies_when: "规则守门导演发现切镜前后人物位置跳变、让路关系漂移、关系镜头被单人大头吞掉，或下一个事件的时间预算被特写占用。"
    instruction: "把无解释的位置跳变判为硬伤；画面侧边让路位不得无动作解释变成主角身后或并排行走；9:16 大头特写不得吞掉群体反应、台词落点或空间交代时间，必要时改回肩部以上、胸口以上、半身或双层关系中景。"
    avoid_when: "只有剧本明确进入梦境、错觉或主观空间错乱时，才允许破坏空间连续，但必须显式标注动机。"
    source_files:
      - "knowledge/27_规则守门与最小修复规则.md"
      - "knowledge/28_全场景分镜与转场案例库.md"
    source_rules:
      - "27:九、从 28 号案例库提炼的镜头语法守门清单"

  - id: "GUARD-COVERAGE-CONTRACT-005"
    title: "最终镜头方案必须具备覆盖合同"
    owner_agent: "shot_director_guard"
    priority: "P1"
    applies_when: "规则守门导演审查最终 shot_director YAML，准备交给 prompt_compiler。"
    instruction: "最终 YAML 必须具备 coverage_role、cut_reason、companion_visibility、state_delta 和 tailframe_role；缺字段时只给已有镜头最小补齐，尾镜头若是局部/单人必须回到可继承关系景或明确空间状态。"
    avoid_when: "不得为了补字段重写剧本、重排 shot_id 或新增剧本外动作。"
    source_files:
      - "knowledge/27_规则守门与最小修复规则.md"
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/rules/prompt_compiler/TAILFRAME-RELATIONSHOT-001.md"
    source_rules:
      - "27:十、全库检索后补入的覆盖合同守门"

  - id: "TIME-SEGMENT-MULTISHOT-001"
    title: "15秒片段是导演片段不是单分镜"
    owner_agent: "story_planner"
    agent_scope: ["story_planner", "shot_director", "prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "15秒片段、主分镜、子分镜、多镜头、多机位、多景别变化、单层时间轴、0-3秒、3-5秒、5-8秒。"
    instruction: "story_planner 必须把 15 秒视为导演编译单位而非单一长镜头；输出单层时间轴，显式区分主分镜、子分镜和独立时段，避免外层动作单元再嵌套子时间轴。"
    avoid_when: "用户明确锁定单镜，或片段短到不支持多镜头。"
    source_files:
      - "knowledge/rules/story_planner/TIME-SEGMENT-MULTISHOT-001.md"
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
    source_rules:
      - "TIME-SEGMENT-MULTISHOT-001"

  - id: "TIME-ACTION-DENSITY-COVERAGE-004"
    title: "拆片必须按动作密度决定拍摄覆盖而不是逐动作列清单"
    owner_agent: "story_planner"
    agent_scope: ["story_planner", "rhythm_rewrite_director", "shot_director", "quality_inspector"]
    priority: "P0"
    applies_when: "拆片、动作密集、动作很多、事件覆盖、省略动作、必拍动作、可压缩动作、可省略动作、动作密度、每五秒镜头数。"
    instruction: "story_planner 必须把动作分成必拍、可压缩、可省略，并给动作密度、推荐节奏档位和每5秒镜头数建议；若必拍动作超出片段承载密度，必须拆成多个片段。"
    avoid_when: "用户明确要求逐动作记录，且不是给视频生成模型使用。"
    source_files:
      - "knowledge/rules/story_planner/TIME-ACTION-DENSITY-COVERAGE-004.md"
      - "knowledge/rules/rhythm_rewrite_director/RHYTHM-SHOT-DENSITY-MATRIX-003.md"
      - "knowledge/rules/prompt_compiler/PROMPT-CUT-BUDGET-001.md"
    source_rules:
      - "TIME-ACTION-DENSITY-COVERAGE-004"

  - id: "RHYTHM-SHOT-DENSITY-MATRIX-003"
    title: "每五秒镜头密度与镜头时长矩阵"
    owner_agent: "rhythm_rewrite_director"
    agent_scope: ["rhythm_rewrite_director", "story_planner", "shot_director", "shot_director_layout", "shot_director_blocking", "prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "节奏判断、每5秒镜头数、镜头时长、目标ASL、单镜时长范围、极短插入、动作密度、紧凑生活动作、高压动作峰值、切镜预算。"
    instruction: "rhythm_rewrite_director 必须把快、慢、紧凑、压迫、留白翻译成每5秒镜头密度档位、目标ASL、单镜时长范围和例外条件；默认不得超过高压/动作峰值档。"
    avoid_when: "用户明确指定单镜到底或固定镜头实验风格。"
    source_files:
      - "knowledge/rules/rhythm_rewrite_director/RHYTHM-SHOT-DENSITY-MATRIX-003.md"
      - "knowledge/rules/prompt_compiler/PROMPT-CUT-BUDGET-001.md"
      - "knowledge/rules/shot_director_blocking/BLOCKING-FAST-CUT-LEGIBILITY-008.md"
    source_rules:
      - "RHYTHM-SHOT-DENSITY-MATRIX-003"

  - id: "SCENE-REQUIRED-PROP-GAP-002"
    title: "剧本关键道具缺口必须交接给剧情增强"
    owner_agent: "scene_analyst"
    agent_scope: ["scene_analyst", "director_showrunner", "story_planner", "shot_director_layout", "quality_inspector"]
    priority: "P0"
    applies_when: "剧本出现关键道具、参考图缺少关键道具、闹钟、书包、照片、钥匙、药瓶、首帧空间锚定、道具可见位置、关键道具缺口。"
    instruction: "scene_analyst 必须对照原剧本和参考图识别关键道具缺口，输出剧本锚点、参考图状态、可补空间和可补道具约束，交给 director_showrunner、story_planner 与 shot_director_layout；自身不做剧情增强。"
    avoid_when: "关键道具已在参考图或场景卡中清楚可见；或该物件不是剧本动作、台词、因果或尾帧继承所需。"
    source_files:
      - "knowledge/rules/scene_analyst/SCENE-REQUIRED-PROP-GAP-002.md"
      - "knowledge/11_场景分析输入卡与导演意图提取.md"
      - "knowledge/06_连续性与安全规则.md"
    source_rules:
      - "SCENE-REQUIRED-PROP-GAP-002"

  - id: "REFERENCE-ROLE-STRICT-001"
    title: "参考图职责边界必须严格"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "参考图、人物身份、场景空间、尾帧图、人物图、场景图、职责边界、参考图误用。"
    instruction: "每张参考图进入 prompt 前必须绑定职责；人物图只管身份外观，场景图只管空间光线，尾帧图只管首帧继承；当前无戏份人物不得被保留。"
    avoid_when: "没有任何参考图进入 prompt。"
    source_files:
      - "knowledge/rules/prompt_compiler/REFERENCE-ROLE-STRICT-001.md"
      - "knowledge/rules/prompt_compiler/PROMPT-REFERENCE-BINDING-001.md"
      - "knowledge/rules/prompt_compiler/REF-TAILFRAME-PRIORITY-001.md"
    source_rules:
      - "REFERENCE-ROLE-STRICT-001"

  - id: "PROMPT-REFERENCE-BINDING-001"
    title: "参考图先绑定职责再进入时间轴"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "参考图、人物身份、场景参考、image_id、role、target_id、first_appearance_segment、scope、时间轴前绑定职责。"
    instruction: "先写清每张参考图职责，再进入时间轴；人物图只管身份外观，场景图只管空间光线，尾帧图只管首帧继承；同一时间段不要反复调用图片。"
    avoid_when: "没有使用任何人物、场景或尾帧参考图。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-REFERENCE-BINDING-001.md"
      - "knowledge/rules/prompt_compiler/REFERENCE-ROLE-STRICT-001.md"
    source_rules:
      - "PROMPT-REFERENCE-BINDING-001"

  - id: "PROMPT-CINEMATIC-DOWNTRANSLATION-002"
    title: "复杂分镜必须降维成视频模型可执行动作"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "Seedance prompt、prompt_compiler、main_shots、复杂分镜、复杂运镜、抽象镜头词、模型可执行动作、降维翻译。"
    instruction: "只把已定导演决策翻译为主体、机位、路径、动作、视线、切入点与尾帧状态；复杂导演术语必须降维为视频模型可执行的自然画面语。"
    avoid_when: "输入不是最终模型 prompt 编译任务。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-CINEMATIC-DOWNTRANSLATION-002.md"
      - "knowledge/rules/prompt_compiler/PROMPT-DIRECTOR-JARGON-TRANSLATION-001.md"
    source_rules:
      - "PROMPT-CINEMATIC-DOWNTRANSLATION-002"

  - id: "PROMPT-DIRECTOR-JARGON-TRANSLATION-001"
    title: "导演调度口语必须翻译成可见画面语言"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "导演调度、Seedance Prompt、运镜、戏剧张力、压迫感、电影感、镜头序列句、自然画面语。"
    instruction: "将上游已定意图翻译为镜头序列句：主体、景别、简洁机位、动作、视线和切镜触发；不得原样输出导演口语、抽象情绪或幕后调度词。"
    avoid_when: "文本不是模型 prompt 或可执行时间轴。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-DIRECTOR-JARGON-TRANSLATION-001.md"
      - "knowledge/rules/prompt_compiler/PROMPT-NATURAL-SENTENCE-001.md"
      - "knowledge/rules/shot_director/MOTION-MODALITY-001.md"
    source_rules:
      - "PROMPT-DIRECTOR-JARGON-TRANSLATION-001"

  - id: "PROMPT-HARD-CONSTRAINT-DEDUP-001"
    title: "硬约束去重与集中收束"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "硬约束、时间轴、prompt清洗、字幕约束、角色约束、轴线约束、门状态、距离契约、尾帧约束、重复约束。"
    instruction: "将字幕、角色、轴线、门状态、距离、尾帧等硬约束集中去重；时间轴只保留正向画面动作，不在每个时间段重复规则。"
    avoid_when: "当前 prompt 没有重复硬约束。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-HARD-CONSTRAINT-DEDUP-001.md"
      - "knowledge/rules/prompt_compiler/TIMELINE-EXECUTION-ONLY-001.md"
    source_rules:
      - "PROMPT-HARD-CONSTRAINT-DEDUP-001"

  - id: "PROMPT-RHYTHM-DENSITY-INHERIT-002"
    title: "Prompt 编译必须继承节奏密度矩阵而不是临时加切镜"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "最终 prompt、节奏密度、镜头时长、切镜预算、节奏档位、镜头数、切点、不要临时加切镜。"
    instruction: "Prompt 只翻译已批准的节奏档位、镜头数、时长和切点；缺失时请求上游补齐，不自行发明镜头、特写或改变镜头时长。"
    avoid_when: "上游没有节奏密度信息且片段是单镜连续动作。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-RHYTHM-DENSITY-INHERIT-002.md"
      - "knowledge/rules/rhythm_rewrite_director/RHYTHM-SHOT-DENSITY-MATRIX-003.md"
      - "knowledge/rules/prompt_compiler/PROMPT-CUT-BUDGET-001.md"
      - "knowledge/rules/shot_director/SHOT-MOTIVATED-CUT-ACTION-DENSITY-002.md"
    source_rules:
      - "PROMPT-RHYTHM-DENSITY-INHERIT-002"

  - id: "PROMPT-SHOT-EXPRESSION-CORE-001"
    title: "镜头表达核心格式"
    owner_agent: "prompt_compiler"
    agent_scope: ["shot_director", "shot_director_blocking", "shot_director_guard", "prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "镜头序列、镜头表达、最终提示词、主体、景别、简洁机位、人物动作、台词、反应、切镜触发；私密对峙、零亲密接触、半步距离、角色名、站位、朝向、可见距离、身体关系表达。"
    instruction: "每个镜头句按【主体】景别，简洁机位，人物动作/台词/反应（切镜触发）输出；用角色名、站位、朝向和可见距离表达关系，禁止写成空间说明书、坐标说明、术语堆叠或抽象导演口号。"
    avoid_when: "内部结构化校验字段，不直接输出给用户或视频模型。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-SHOT-EXPRESSION-CORE-001.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "PROMPT-SHOT-EXPRESSION-CORE-001"

  - id: "PROMPT-TIMELINE-SHOT-BASE-001"
    title: "时间段必须先立分镜基底"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "时间轴、分镜基底、景别显式化、主体、景别、角度、运动方式、一镜一主动作。"
    instruction: "每个时间段必须先建立分镜基底：主体、景别或身体部位、简洁机位、动作/台词/反应与切镜触发；不得先写动作后补镜头。"
    avoid_when: "当前时间段已经先建立分镜基底。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-TIMELINE-SHOT-BASE-001.md"
      - "knowledge/rules/prompt_compiler/PROMPT-SHOT-EXPRESSION-CORE-001.md"
    source_rules:
      - "PROMPT-TIMELINE-SHOT-BASE-001"

  - id: "PROMPT-VISIBLE-BODY-LANGUAGE-001"
    title: "抽象情绪必须翻译成可观察身体语言"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P1"
    applies_when: "抽象情绪、身体语言、反应节拍、微表情、停顿、视线、身体状态、可见动作；零亲密接触、半步距离、扶腰、贴身、怀里、极近脸距、站位、朝向或可见距离需要转成可拍画面。"
    instruction: "把抽象情绪和安全边界翻译为可见动作、微表情、停顿、视线、站位、朝向与身体状态；不得保留无法执行的心理判断或导演口号。"
    avoid_when: "上游已完全给出可见身体动作且无抽象情绪词。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-VISIBLE-BODY-LANGUAGE-001.md"
    source_rules:
      - "PROMPT-VISIBLE-BODY-LANGUAGE-001"

  - id: "TIMELINE-EXECUTION-ONLY-001"
    title: "时间轴纯净执行规则"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "Prompt 时间轴、纯净执行、画面内可见动作、运镜、调度、表情变化、对白声音、禁止幕后解释。"
    instruction: "时间轴只写画面内可见动作、运镜、调度、表情变化和对白声音；严禁混入任何幕后解释、禁忌强调、规则复读或质检说明。"
    avoid_when: "编写约束区、说明区或非时间轴元信息时。"
    source_files:
      - "knowledge/rules/prompt_compiler/TIMELINE-EXECUTION-ONLY-001.md"
      - "knowledge/rules/prompt_compiler/PROMPT-HARD-CONSTRAINT-DEDUP-001.md"
    source_rules:
      - "TIMELINE-EXECUTION-ONLY-001"

  - id: "PHYSICAL-DISTANCE-CONTRACT-001"
    title: "物理距离与亲密接触冲突消解规则"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "零亲密接触、物理距离、保持距离、扶腰、贴身、怀里、极近脸距、亲密接触冲突、身体距离契约。"
    instruction: "如果约束要求零亲密接触或保持距离，编译器必须过滤或替换时间轴内可能产生歧义的亲密接触词汇，只写可见距离、空隙与对峙状态。"
    avoid_when: "片段没有零亲密接触、保持距离或类似物理距离契约。"
    source_files:
      - "knowledge/rules/prompt_compiler/PHYSICAL-DISTANCE-CONTRACT-001.md"
    source_rules:
      - "PHYSICAL-DISTANCE-CONTRACT-001"

  - id: "TAILFRAME-RELATIONSHOT-001"
    title: "尾帧连续性与空间关系收束规则"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "shot_director", "quality_inspector"]
    priority: "P0"
    applies_when: "尾帧、最后一个镜头、片段收束、双人关系景、多人关系景、空间关系、下一段首帧继承、尾帧连续性。"
    instruction: "片段最终尾帧默认回到双人/多人关系景或建立镜头，保留位置、朝向、距离与道具状态；局部特写不能默认作为尾帧。"
    avoid_when: "下一段剧本明确要求从特定局部特写或道具特写开始接续。"
    source_files:
      - "knowledge/rules/prompt_compiler/TAILFRAME-RELATIONSHOT-001.md"
      - "knowledge/rules/prompt_compiler/REF-TAILFRAME-PRIORITY-001.md"
    source_rules:
      - "TAILFRAME-RELATIONSHOT-001"

  - id: "QC-DIRECTOR-TASTE-SCORE-002"
    title: "质检必须评估镜头是否有导演选择"
    owner_agent: "quality_inspector"
    agent_scope: ["quality_inspector"]
    priority: "P0"
    applies_when: "quality_review、shot_director、layout、导演选择、镜头是否平庸、director_taste_score、schema valid but flat、注意力清晰、情绪推进、镜头不可替代性、更强视角机会、低于 7 分。"
    instruction: "输出 director_taste_score 四项评分：注意力清晰、情绪推进、镜头不可替代性、更强视角机会；低于 7 分必须给出 shot_id 和可执行修正，不只检查格式。"
    avoid_when: "review_scope_excludes_shot_design_quality；input_is_only_raw_story_without_shot_plan；safety_or_hard_fail_already_blocks_delivery。"
    source_files:
      - "knowledge/rules/quality_inspector/QC-DIRECTOR-TASTE-SCORE-002.md"
      - "knowledge/17_结果质检与回溯修正规则.md"
    source_rules:
      - "QC-DIRECTOR-TASTE-SCORE-002"

  - id: "QC-HARD-FAIL-001"
    title: "Hard规则违反必须阻断"
    owner_agent: "quality_inspector"
    agent_scope: ["quality_inspector"]
    priority: "P0"
    applies_when: "质检、fail阻断、hard规则、failed_rule_id、evidence、required_repair、违反必须阻断、不可交付。"
    instruction: "命中任一 hard 条件必须 status: fail，并给 failed_rule_id、evidence、required_repair；不得把阻断规则违规标记为 complete。"
    avoid_when: "issue_is_style_preference_not_hard_rule；upstream_input_missing_enough_context_to_verify；already_returned_to_upstream_for_schema_repair。"
    source_files:
      - "knowledge/rules/quality_inspector/QC-HARD-FAIL-001.md"
      - "knowledge/00_知识库优先级与冲突裁决规则.md"
      - "knowledge/17_结果质检与回溯修正规则.md"
    source_rules:
      - "QC-HARD-FAIL-001"

  - id: "QC-RHYTHM-EMOTION-LEGIBILITY-003"
    title: "质检必须检查节奏密度、情绪可读性和动作覆盖价值"
    owner_agent: "quality_inspector"
    agent_scope: ["quality_inspector", "director_showrunner", "rhythm_rewrite_director", "story_planner", "shot_director", "prompt_compiler"]
    priority: "P0"
    applies_when: "质检、节奏密度、情绪表达、情绪可读性、动作覆盖、镜头服务故事、节奏矩阵、返修判断。"
    instruction: "质检必须按节奏矩阵、戏剧任务、动作覆盖和情绪可读性给通过/返修判断；不能只看格式和连续性。"
    avoid_when: "当前只检查非叙事素材或静态参考图。"
    source_files:
      - "knowledge/rules/quality_inspector/QC-RHYTHM-EMOTION-LEGIBILITY-003.md"
      - "knowledge/rules/rhythm_rewrite_director/RHYTHM-SHOT-DENSITY-MATRIX-003.md"
      - "knowledge/rules/shot_director_guard/GUARD-EMOTION-STORY-RHYTHM-PRIORITY-007.md"
    source_rules:
      - "QC-RHYTHM-EMOTION-LEGIBILITY-003"

  - id: "FRAME-SUBJECT-SCALE-001"
    title: "切镜必须写清主体景别与看点"
    owner_agent: "shot_director"
    agent_scope: ["shot_director", "prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "景别显式化、切镜、时间轴、主体、景别、身体部位、可见看点、镜头看什么。"
    instruction: "每次切镜必须写清切到谁、对应景别或局部、切后具体看点；不得只写切到近景、切到特写或换角度。"
    avoid_when: "no_cut_or_time_axis；subject_scale_focus_already_explicit。"
    source_files:
      - "knowledge/rules/shot_director/FRAME-SUBJECT-SCALE-001.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "FRAME-SUBJECT-SCALE-001"

  - id: "SHOT-ACTION-APEX-PRECUT-001"
    title: "动作顶点前切入"
    owner_agent: "shot_director"
    agent_scope: ["story_planner", "shot_director", "prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "动作顶点、动作顶点前、切镜时机、主分镜、未完成状态、动作承接、action apex。"
    instruction: "把子分镜切点放在动作顶点前半拍，用可见的未完成状态承接动作；不要等动作完全结束后再切。"
    avoid_when: "no_action_transition；action_must_be_seen_complete_for_story。"
    source_files:
      - "knowledge/rules/shot_director/SHOT-ACTION-APEX-PRECUT-001.md"
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
    source_rules:
      - "SHOT-ACTION-APEX-PRECUT-001"

  - id: "SHOT-ACTION-COVERAGE-001"
    title: "动作戏先保全貌再拆冲击"
    owner_agent: "shot_director"
    agent_scope: ["shot_director", "prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "动作戏、爆发戏、竖屏动作、动作覆盖、保全貌、冲击点、动作空间、人物关系。"
    instruction: "先建立动作形态，冲击点切近，再回到人物关系或尾帧状态；动作戏不能只有冲击特写而没有动作地理。"
    avoid_when: "non_action_dialogue_scene；action_already_clear_in_single_main_shot。"
    source_files:
      - "knowledge/rules/shot_director/SHOT-ACTION-COVERAGE-001.md"
      - "knowledge/20_镜头库与机位库.md"
    source_rules:
      - "SHOT-ACTION-COVERAGE-001"

  - id: "SHOT-DIALOGUE-COVERAGE-001"
    title: "对话戏基础覆盖"
    owner_agent: "shot_director"
    agent_scope: ["shot_director", "prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "双人对话、长对白、停顿气口、暂停、听者反应、reaction、OTS、正反切、关系镜头、信息落点、对话覆盖。"
    instruction: "使用关系镜头、OTS、正反覆盖或听者反应承接对白信息落点；长对白必须拆出停顿气口，避免静态说话头像。"
    avoid_when: "no_two_person_dialogue；high_impact_conflict_requires_conflict_rule。"
    source_files:
      - "knowledge/rules/shot_director/SHOT-DIALOGUE-COVERAGE-001.md"
      - "knowledge/20_镜头库与机位库.md"
    source_rules:
      - "SHOT-DIALOGUE-COVERAGE-001"

  - id: "SHOT-MOTIVATED-CUT-ACTION-DENSITY-002"
    title: "镜头导演按动作密度和信息增量决定切不切"
    owner_agent: "shot_director"
    agent_scope: ["shot_director", "shot_director_layout", "shot_director_blocking", "shot_director_guard", "prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "镜头设计、动作密度、切镜理由、信息增量、动作阶段变化、台词落点、情绪转折、切不切。"
    instruction: "每个切镜必须有信息增量、动作阶段变化、台词落点或情绪转折；否则并回父镜头。"
    avoid_when: "实验性碎片蒙太奇由用户明确指定，且允许破坏连续性。"
    source_files:
      - "knowledge/rules/shot_director/SHOT-MOTIVATED-CUT-ACTION-DENSITY-002.md"
      - "knowledge/rules/rhythm_rewrite_director/RHYTHM-SHOT-DENSITY-MATRIX-003.md"
      - "knowledge/rules/story_planner/TIME-ACTION-DENSITY-COVERAGE-004.md"
      - "knowledge/rules/shot_director_blocking/BLOCKING-FAST-CUT-LEGIBILITY-008.md"
    source_rules:
      - "SHOT-MOTIVATED-CUT-ACTION-DENSITY-002"

  - id: "SHOT-SOURCE-EVENT-FIDELITY-001"
    title: "shot_director 只能继承 source_script_events"
    owner_agent: "shot_director"
    agent_scope: ["shot_director", "quality_inspector", "prompt_compiler"]
    priority: "P0"
    applies_when: "镜头设计、剧本忠实度、道具连续性、source_script_events、只继承剧本事件、不补剧情。"
    instruction: "只把 source_script_events 翻译成镜头，保留人物名、空间、道具和可见状态，不新增事件、人物关系、台词或关键道具。"
    avoid_when: "no_source_script_events_available；explicit_user_authorized_adaptation。"
    source_files:
      - "knowledge/rules/shot_director/SHOT-SOURCE-EVENT-FIDELITY-001.md"
      - "knowledge/00_知识库优先级与冲突裁决规则.md"
      - "knowledge/06_连续性与安全规则.md"
    source_rules:
      - "SHOT-SOURCE-EVENT-FIDELITY-001"

  - id: "SHOT-ASPECT-VERTICAL-TYPES-030"
    title: "画幅映射与竖屏专用镜头类型"
    owner_agent: "shot_director"
    agent_scope: ["shot_director", "shot_director_layout", "shot_director_blocking", "shot_director_guard", "prompt_compiler", "quality_inspector"]
    priority: "P1"
    applies_when: "9:16竖屏、16:9横屏、1:1方画幅、2.39:1宽画幅、竖屏正反切、纵深前后、分层过肩、双层关系景、分区群像。"
    instruction: "按画幅选择主力镜头，并把竖屏专用镜头类型写成自然画面语；抽象镜头词必须转换为主体、空间层次和可见动作。"
    avoid_when: "未识别到画幅且用户不要求画幅推断；剧本明确要求非写实实验影像。"
    source_files:
      - "knowledge/rules/shot_director/SHOT-ASPECT-VERTICAL-TYPES-030.md"
      - "knowledge/30_画幅镜头映射与竖屏专用镜头规则.md"
    source_rules:
      - "SHOT-ASPECT-VERTICAL-TYPES-030"

  - id: "SHOT-ACTION-GROUP-BUDGET-031"
    title: "动作群戏预算与跨片段节奏"
    owner_agent: "shot_director"
    agent_scope: ["shot_director", "shot_director_layout", "shot_director_blocking", "shot_director_guard", "prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "动作戏、四人以上群戏、四人同场、群体动作、群戏冲突、动作群戏、同一场景连续多个片段、模型可生成性、切镜预算、镜头预算、切镜预算超载、跨片段景别节奏、预算降级。"
    instruction: "动作戏、群戏和跨片段节奏必须按覆盖、镜头预算、预算降级和景别节奏共同决策，避免同景别重复与模型不可生成。"
    avoid_when: "纯静态单人镜头；不存在动作、群戏或跨片段节奏问题。"
    source_files:
      - "knowledge/rules/shot_director/SHOT-ACTION-GROUP-BUDGET-031.md"
      - "knowledge/31_程序化镜头表结构与跨片段节奏规则.md"
    source_rules:
      - "SHOT-ACTION-GROUP-BUDGET-031"

  - id: "LAYOUT-FIRST-FRAME-SPATIAL-ANCHOR-006"
    title: "首帧必须先建立人物和关键道具关系"
    owner_agent: "shot_director_layout"
    agent_scope: ["shot_director_layout", "shot_director_guard", "prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "首帧、双人同场、关键道具动作、人物关系锚点、关键道具、固定物体、尾帧继承、首帧缺锚。"
    instruction: "main_shots 必须先给首帧关系锚点：在场人物、关键道具、固定物体、可继承尾帧；避免人物和道具突然出现。"
    avoid_when: "片段只有单人、无同场关系、无关键道具，且上一段尾帧已经清楚继承。"
    source_files:
      - "knowledge/rules/shot_director_layout/LAYOUT-FIRST-FRAME-SPATIAL-ANCHOR-006.md"
      - "knowledge/rules/scene_analyst/SCENE-REQUIRED-PROP-GAP-002.md"
      - "knowledge/rules/shot_director_layout/LAYOUT-COVERAGE-BLUEPRINT-005.md"
    source_rules:
      - "LAYOUT-FIRST-FRAME-SPATIAL-ANCHOR-006"

  - id: "LAYOUT-MAINSHOT-ONLY-001"
    title: "主分镜骨架阶段只输出主镜头合同"
    owner_agent: "shot_director_layout"
    agent_scope: ["shot_director_layout", "quality_inspector"]
    priority: "P0"
    applies_when: "主分镜骨架、main_shots、输出合同、fragment_id、fragment_intent、continuity_anchor、不写reaction_coverage、不写sub_shots。"
    instruction: "layout 阶段只输出 fragment_id、fragment_intent、continuity_anchor、main_shots，不抢写 reaction_coverage、sub_shots 或解释散文。"
    avoid_when: "当前阶段是 shot_director_blocking，需要补 reaction_coverage 或 sub_shots；当前阶段是 shot_director_guard，只允许最小修复既有方案。"
    source_files:
      - "knowledge/rules/shot_director_layout/LAYOUT-MAINSHOT-ONLY-001.md"
      - "knowledge/25_镜头摆位主分镜骨架规则.md"
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
    source_rules:
      - "LAYOUT-MAINSHOT-ONLY-001"

  - id: "LAYOUT-SHOTID-STABILITY-001"
    title: "主分镜骨架必须先锁定稳定 shot_id"
    owner_agent: "shot_director_layout"
    agent_scope: ["shot_director_layout", "quality_inspector"]
    priority: "P0"
    applies_when: "shot_id、main_shots、下游交接、parent_shot_id、稳定编号、顺序递增、不能跳号。"
    instruction: "每个 main_shot 必须有稳定 shot_id；同一 fragment 内顺序递增，供下游 parent_shot_id 挂接。"
    avoid_when: "当前只是读取或审查既有 shot_id，不生成新的 main_shots；guard 阶段正在最小范围修复真实重复编号。"
    source_files:
      - "knowledge/rules/shot_director_layout/LAYOUT-SHOTID-STABILITY-001.md"
      - "knowledge/25_镜头摆位主分镜骨架规则.md"
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "LAYOUT-SHOTID-STABILITY-001"

  - id: "LAYOUT-VERTICAL-RELATION-FIRST-001"
    title: "竖屏摆位优先关系镜头而不是特写堆叠"
    owner_agent: "shot_director_layout"
    agent_scope: ["shot_director_layout", "quality_inspector"]
    priority: "P0"
    applies_when: "9:16竖屏、主镜头摆位、景别主力、半身、中景、双人关系镜头、特写堆叠、微细节不得升主镜头。"
    instruction: "9:16 主镜头优先半身、中景、双人关系镜头；微细节不得升成主镜头，避免竖屏画面被脸部特写堆满。"
    avoid_when: "画幅不是 9:16；单个特写是唯一能交代剧情信息或心理顶点的主镜头。"
    source_files:
      - "knowledge/rules/shot_director_layout/LAYOUT-VERTICAL-RELATION-FIRST-001.md"
      - "knowledge/25_镜头摆位主分镜骨架规则.md"
      - "knowledge/02_焦段景深与景别画幅策略.md"
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
    source_rules:
      - "LAYOUT-VERTICAL-RELATION-FIRST-001"

  - id: "BLOCKING-SUBSHOT-TRIGGER-007"
    title: "子镜头必须由信息增量触发"
    owner_agent: "shot_director_blocking"
    agent_scope: ["shot_director_blocking", "shot_director_guard", "quality_inspector"]
    priority: "P0"
    applies_when: "sub_shots、reaction_coverage、action_insert_slot、信息增量、动作桥接、受击反应、声音落点、parent_shot_id、trigger、cut_point。"
    instruction: "sub_shots 只能由明确信息增量、动作桥接、受击反应或声音落点触发，并必须包含 parent_shot_id、trigger、cut_point、action_phase、duration_hint、state_delta。"
    avoid_when: "当前没有信息增量、动作桥接、受击反应或声音落点；主镜头已经完整覆盖信息、动作和反应，额外插入会破坏节奏。"
    source_files:
      - "knowledge/rules/shot_director_blocking/BLOCKING-SUBSHOT-TRIGGER-007.md"
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
    source_rules:
      - "BLOCKING-SUBSHOT-TRIGGER-007"

  - id: "BLOCKING-FAST-CUT-LEGIBILITY-008"
    title: "快切必须服从可读性和镜头时长预算"
    owner_agent: "shot_director_blocking"
    agent_scope: ["shot_director_blocking", "shot_director_guard", "prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "快切、6秒片段、动作密集、台词覆盖、镜头时长预算、1-3秒/镜、低于1秒、3-4个可读镜头、过碎快切。"
    instruction: "快切默认 1-3 秒/镜，低于 1 秒只允许用于明确信息增量；6 秒叙事段优先 3-4 个可读镜头，先保证动作、台词、同场关系和道具状态可读。"
    avoid_when: "单一连续长镜已能清楚覆盖动作、台词和状态变化。"
    source_files:
      - "knowledge/rules/shot_director_blocking/BLOCKING-FAST-CUT-LEGIBILITY-008.md"
      - "knowledge/rules/prompt_compiler/PROMPT-CUT-BUDGET-001.md"
      - "knowledge/rules/shot_director_blocking/BLOCKING-SUBSHOT-TRIGGER-007.md"
    source_rules:
      - "BLOCKING-FAST-CUT-LEGIBILITY-008"

  - id: "GUARD-FIRST-FRAME-PROP-CUT-BUDGET-006"
    title: "守门必须拦截首帧缺锚和过碎快切"
    owner_agent: "shot_director_guard"
    agent_scope: ["shot_director_guard", "quality_inspector", "prompt_compiler"]
    priority: "P0"
    applies_when: "首帧缺锚、关键道具缺失、快切过碎、切镜预算、人物突然出现、道具凭空出现、6秒片段不可读碎镜。"
    instruction: "guard 必须最小修复首帧关系锚点、关键道具可见性和切镜预算；补足同场人物、关键道具、固定物体，删除或并回无信息短切。"
    avoid_when: "首帧、道具、人物关系和切镜预算均已清楚满足。"
    source_files:
      - "knowledge/rules/shot_director_guard/GUARD-FIRST-FRAME-PROP-CUT-BUDGET-006.md"
      - "knowledge/rules/shot_director_layout/LAYOUT-FIRST-FRAME-SPATIAL-ANCHOR-006.md"
      - "knowledge/rules/shot_director_blocking/BLOCKING-FAST-CUT-LEGIBILITY-008.md"
    source_rules:
      - "GUARD-FIRST-FRAME-PROP-CUT-BUDGET-006"

  - id: "GUARD-EMOTION-STORY-RHYTHM-PRIORITY-007"
    title: "守门按情绪故事节奏优先级裁剪镜头"
    owner_agent: "shot_director_guard"
    agent_scope: ["shot_director_guard", "shot_director_blocking", "prompt_compiler", "quality_inspector"]
    priority: "P0"
    applies_when: "最终守门、情绪表达、故事信息、节奏优先级、切镜裁剪、台词覆盖、反应落点、机械切镜、无信息短切。"
    instruction: "守门裁剪切镜时按情绪、故事、节奏、视线、画面方向、三维空间排序；优先保护情绪冲击、剧情信息和台词/反应落点，再保留空间与轴线层面的切镜。"
    avoid_when: "当前镜头表没有切镜、情绪或台词问题。"
    source_files:
      - "knowledge/rules/shot_director_guard/GUARD-EMOTION-STORY-RHYTHM-PRIORITY-007.md"
      - "knowledge/rules/shot_director/SHOT-MOTIVATED-CUT-ACTION-DENSITY-002.md"
      - "knowledge/rules/shot_director_blocking/BLOCKING-FAST-CUT-LEGIBILITY-008.md"
    source_rules:
      - "GUARD-EMOTION-STORY-RHYTHM-PRIORITY-007"

  - id: "SHOT-MULTICAM-SYSTEM-029"
    title: "多机位体系必须先于具体镜头选择"
    owner_agent: "shot_director"
    agent_scope:
      - "shot_director_layout"
      - "shot_director_blocking"
      - "shot_director_guard"
      - "prompt_compiler"
      - "quality_inspector"
    priority: "P1"
    applies_when: "对白、冲突、群戏、动作或反应覆盖需要选择观看位置时。"
    instruction: "先判断二机、三机或四机覆盖分工，再写自然中文镜头。二机负责关系与反应；三机负责关系、发言、受击；四机负责总关系、核心发言、受击反应、游动补偿。"
    avoid_when: "禁止默认把所有镜头写成同侧固定机位和中近景；禁止输出二号机、三号机、内部编号或英文缩写。"
    source_files:
      - "knowledge/29_多机位体系与预算降级规则.md"
      - "knowledge/rules/shot_director/SHOT-MULTICAM-SYSTEM-029.md"
    source_rules:
      - "29:二至五"
      - "SHOT-MULTICAM-SYSTEM-029"

  - id: "SHOT-ASPECT-MAPPING-030"
    title: "画幅决定主力镜头池"
    owner_agent: "shot_director"
    agent_scope:
      - "shot_director_layout"
      - "shot_director_blocking"
      - "shot_director_guard"
      - "prompt_compiler"
      - "quality_inspector"
    priority: "P1"
    applies_when: "镜头导演或提示词编译器收到 9:16、16:9、1:1 或 2.39:1 画幅要求时。"
    instruction: "按画幅选择主力镜头。9:16 优先半身、七分身、中近、肩后关系、纵深前后和分区群像；16:9 可承载横向多人关系；1:1 优先单人或双人稳定关系；2.39:1 只在明确需要宽银幕关系时使用。"
    avoid_when: "禁止竖屏横向硬塞多人；禁止连续强特写替代空间关系；禁止把宽银幕逻辑套到竖屏项目。"
    source_files:
      - "knowledge/30_画幅镜头映射与竖屏专用镜头规则.md"
      - "knowledge/rules/shot_director/SHOT-ASPECT-VERTICAL-TYPES-030.md"
    source_rules:
      - "30:二至三"
      - "SHOT-ASPECT-VERTICAL-TYPES-030"

  - id: "SHOT-VERTICAL-TYPES-030"
    title: "竖屏专用镜头必须自然表达"
    owner_agent: "shot_director"
    agent_scope:
      - "shot_director_blocking"
      - "prompt_compiler"
      - "quality_inspector"
    priority: "P1"
    applies_when: "9:16 竖屏中出现正反切、前后层次、过肩、群像、入口或分屏需求。"
    instruction: "可使用竖屏正反切、纵深前后、分层过肩、双层关系、分区群像、信息插入、压入和近主观，但最终必须写清从谁看向谁、谁在近处、谁在远处、真实环境物是什么。"
    avoid_when: "禁止输出门框侧斜向纵深双人中景、前景压线等抽象组合名；除非剧本明确要求真实分屏，否则不要输出分屏效果。"
    source_files:
      - "knowledge/30_画幅镜头映射与竖屏专用镜头规则.md"
      - "knowledge/rules/shot_director/SHOT-ASPECT-VERTICAL-TYPES-030.md"
    source_rules:
      - "30:四"

  - id: "SHOT-PROGRAMMATIC-SCHEMA-031"
    title: "镜头库与机位库必须带程序化字段"
    owner_agent: "shot_director"
    agent_scope:
      - "prompt_compiler"
      - "quality_inspector"
    priority: "P2"
    applies_when: "新增或检索镜头库、机位库、案例库条目时。"
    instruction: "每个镜头条目至少标注镜头类型、主体数量、景别范围、观看位置、机位高度、运动方式、适用任务、触发条件、禁用条件、可生成性、预算等级、画幅适配和自然中文模板。"
    avoid_when: "禁止只有抽象镜头名而没有自然中文模板；禁止让内部表字段进入最终 prompt。"
    source_files:
      - "knowledge/31_程序化镜头表结构与跨片段节奏规则.md"
    source_rules:
      - "31:二至三"

  - id: "SHOT-GROUP-DIALOGUE-029"
    title: "四人以上群戏先分区再切人"
    owner_agent: "shot_director"
    agent_scope:
      - "shot_director_layout"
      - "shot_director_blocking"
      - "quality_inspector"
    priority: "P1"
    applies_when: "四人以上对话、会议、家庭争吵、走廊堵截或多人围观。"
    instruction: "先建立主冲突区、旁观区、入口区和结果区，再按发言、受击和信息变化切镜。无戏份角色不得平均分配镜头。"
    avoid_when: "禁止从左到右机械报人物；禁止竖屏里把所有人横向挤成一排。"
    source_files:
      - "knowledge/29_多机位体系与预算降级规则.md"
      - "knowledge/31_程序化镜头表结构与跨片段节奏规则.md"
    source_rules:
      - "29:七"
      - "31:六"

  - id: "SHOT-ACTION-SPECIAL-031"
    title: "动作戏按前摇切点受击结果拆解"
    owner_agent: "shot_director"
    agent_scope:
      - "shot_director_blocking"
      - "shot_director_guard"
      - "quality_inspector"
    priority: "P1"
    applies_when: "击打、推搡、抢夺、追赶、倒地、强拉强拽或复杂身体接触。"
    instruction: "动作戏优先可读性：先拍前摇，再在接触前、接触瞬间或动作完成一半时切出，然后拍受击反应和结果回收。"
    avoid_when: "禁止同一镜头同时快速运镜、快速动作和快速切镜；禁止只写激烈、凌厉而不写身体部位、方向和结果。"
    source_files:
      - "knowledge/31_程序化镜头表结构与跨片段节奏规则.md"
      - "knowledge/rules/shot_director/SHOT-ACTION-GROUP-BUDGET-031.md"
    source_rules:
      - "31:五"
      - "SHOT-ACTION-GROUP-BUDGET-031"

  - id: "SHOT-CROSS-SEGMENT-RHYTHM-031"
    title: "跨片段景别节奏必须回看最近片段"
    owner_agent: "shot_director"
    agent_scope:
      - "shot_director_layout"
      - "shot_director_blocking"
      - "shot_director_guard"
      - "quality_inspector"
    priority: "P2"
    applies_when: "同一场景连续输出多个片段，或上一片段尾帧已经给出强特写、中近景、关系景。"
    instruction: "检查最近三到五个片段的开头镜头、结尾镜头和主力景别。上一片段强特写结束，下一片段优先关系复位或半身中景；连续同类中近景后，下段应换观看位置或镜头任务。"
    avoid_when: "禁止为了多样性破坏轴线、人物位置、尾帧继承或剧本事实。"
    source_files:
      - "knowledge/31_程序化镜头表结构与跨片段节奏规则.md"
      - "knowledge/rules/shot_director/SHOT-ACTION-GROUP-BUDGET-031.md"
    source_rules:
      - "31:四"

  - id: "SHOT-BUDGET-DEGRADE-029"
    title: "预算降级先删复杂度不删关系"
    owner_agent: "shot_director"
    agent_scope:
      - "prompt_compiler"
      - "quality_inspector"
    priority: "P2"
    applies_when: "镜头方案超出模型可生成性、单段切镜预算或多人动作复杂度。"
    instruction: "低预算保留关系与反应；中预算保留发言、受击、关系回收；高预算可以用四机位和分区群戏。降级时先删复杂运动、多人同时动作和无必要局部，不删关系交代和受击反应。"
    avoid_when: "禁止把预算降级理解成全段同一固定机位；禁止删掉观众理解所需的空间复位。"
    source_files:
      - "knowledge/29_多机位体系与预算降级规则.md"
      - "knowledge/rules/shot_director/SHOT-MULTICAM-SYSTEM-029.md"
    source_rules:
      - "29:八"

  - id: "SHOT-VIEWPOINT-POOL-029"
    title: "九类观看位置池必须翻译成自然中文"
    owner_agent: "shot_director"
    agent_scope:
      - "shot_director_layout"
      - "shot_director_blocking"
      - "prompt_compiler"
      - "quality_inspector"
    priority: "P2"
    applies_when: "镜头导演需要增加机位变化、避免同侧固定机位单调，或处理门口、桌边、走廊、群戏分区。"
    instruction: "可从正面微侧、侧面关系、斜侧纵深、肩后关系、跟随背侧、高位俯看、低位仰看、近主观、局部信息中选取，但必须写清主体、观看路径和真实空间锚点。"
    avoid_when: "禁止把位置类型作为抽象镜头名直接输出；禁止使用左右作为唯一定位依据。"
    source_files:
      - "knowledge/29_多机位体系与预算降级规则.md"
    source_rules:
      - "29:六"

  - id: "SHOT-VERTICAL-SPLITSCREEN-030"
    title: "竖屏分屏默认改写为分层而非真实分屏"
    owner_agent: "shot_director"
    agent_scope:
      - "prompt_compiler"
      - "quality_inspector"
    priority: "P1"
    applies_when: "9:16 竖屏出现分屏、同步动作、两处动作同时可见或用户描述上下/前后两层信息。"
    instruction: "除非剧本明确要求真实分屏效果，否则把分屏改写为同一竖屏画面里的上下分层、前后分层或区域切换，并写清两处动作是否同时发生。"
    avoid_when: "禁止让模型生成无依据的真实分屏画面；禁止只写分屏而不写主体和动作。"
    source_files:
      - "knowledge/30_画幅镜头映射与竖屏专用镜头规则.md"
    source_rules:
      - "30:四"

  - id: "SHOT-VERTICAL-STABILITY-030"
    title: "竖屏镜头按生成稳定性排序"
    owner_agent: "shot_director"
    agent_scope:
      - "shot_director_guard"
      - "prompt_compiler"
      - "quality_inspector"
    priority: "P1"
    applies_when: "竖屏镜头包含多人、复杂运动、极特写、环绕、手持或抽象构图词。"
    instruction: "优先使用固定机位半身中景、七分身景、双人关系景、明确目标的肩后关系和慢速推近；多人分区、入口纵深和局部信息作为中等风险；快速手持、环绕、急推急拉、真实分屏和多人同时大幅动作作为高风险。"
    avoid_when: "禁止把高风险镜头当默认高级感；禁止在同一镜头堆叠复杂运镜、多人动作和抽象构图。"
    source_files:
      - "knowledge/30_画幅镜头映射与竖屏专用镜头规则.md"
    source_rules:
      - "30:五"
