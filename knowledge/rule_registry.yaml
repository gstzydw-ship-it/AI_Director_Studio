    title: "参考图到角色空间尾帧强绑定"
    owner_agent: "scene_analyst"
    priority: "P0"
    applies_when: "scene_analyst 收到任意参考图（主角身份、对手身份、空间关系、场景空间、上一镜尾帧）。"
    instruction: "每张参考图必须显式绑定到 hero_id / rival_id / position_map / space_map / prev_tailframe 之一，并填齐 image_id、target_id、first_appearance_segment、scope 字段。"
    avoid_when: "不得仅标注'用于参考'或跨片段滥用 prev_tailframe；不得在 scene_analyst 阶段改写图内容。"
    source_files:
      - "knowledge/11_场景分析输入卡与导演意图提取.md"
      - "knowledge/rules/scene_analyst/SCENE-REF-IMAGE-BINDING-001.md"
