      - "11:I层"

  - id: "CONT-SCENE-001"
    title: "新场景先做场面总控"
    owner_agent: "scene_analyst"
    priority: "P1"
    applies_when: "新场景没有参考图、空间关系或人物站位尚未建立。"
    instruction: "必须先建立场面总控，明确空间、人物位置、关系、光线和关键道具，再进入分镜。"
    avoid_when: "同场景已有参考图或上一段尾帧可稳定继承。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
    source_rules:
      - "06:规则01"
      - "06:规则03"

  - id: "CONT-SPACE-002"
    title: "切镜不等于重建空间"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "同一场景内切近景、特写、反应或反打。"
    instruction: "切镜只改变观看角度，不得重建人物关系、空间布局、道具位置或对象锚点。"
    avoid_when: "明确进入新场景或时间跳跃，并由 story_planner 标注边界。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
    source_rules:
      - "06:规则05"
      - "06:规则07"

  - id: "CONT-AXIS-003"
    title: "建立后必须守轴"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "首次建立人物关系、视线方向或动作轴线后。"
    instruction: "后续镜头必须维护轴线和视线对象关系，反打镜头也要保住原场面关系。"
    avoid_when: "只有幻觉、精神错乱或梦境等异常心理场景允许注册为越轴例外。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "06:规则08"
      - "06:规则10"

  - id: "CONT-ACTION-004"
    title: "动作接续落到具体身体部位"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "动作跨镜头、切特写或局部承接前镜动作。"
    instruction: "必须写清手、脚、眼神、身体重心或道具的接续关系，避免笼统说继续动作。"
    avoid_when: "动作已经在上一主分镜结束，并进入新的独立事件。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/14_动作描述精细化控制规则.md"
    source_rules:
      - "06:规则11"
      - "06:规则12"

  - id: "CONT-PROP-005"
    title: "道具和光线状态默认延续"
    owner_agent: "quality_inspector"
    priority: "P1"
    applies_when: "同一场景跨镜头或跨片段持续出现道具、服装、光线和环境状态。"
    instruction: "道具持有方式、摆放位置、开关状态、光线方向和强弱默认延续，除非剧本明确发生改变。"
    avoid_when: "存在明确时间跳跃、空间切换或角色主动改变道具状态。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "06:规则13"
      - "06:规则14"
      - "18:规则16"

  - id: "SAFETY-INTIMACY-001"
    title: "私密场景看情绪不看身体"
    owner_agent: "quality_inspector"
    priority: "P0"
    applies_when: "亲密、暧昧、身体接触、脆弱姿态或容易滑向身体凝视的场景。"
    instruction: "镜头必须服务情绪、关系和叙事动机，不以身体部位作为观看目的。"
    avoid_when: "身体部位没有清晰叙事动机或会造成不必要凝视。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
    source_rules:
      - "06:规则15"
      - "06:规则16"

  - id: "PROMPT-STRUCT-001"
    title: "最终 Seedance prompt 输出结构必须是可执行导演指令"
    owner_agent: "prompt_compiler"
    priority: "P1"
    applies_when: "将上游分镜编译成 Seedance 提示词；需要最终输出结构、单层时间轴、一镜一主动作、多人同句去歧义。"
    instruction: "最终输出必须是 Seedance 可直接生成的自然中文导演 prompt：按角色参考总控、空间与首帧总控、时间轴、约束、参考调用组织；时间轴每段先写主体、景别、机位、空间，再写一镜一主动作；关键动作后补表情锚点；多人同句必须写角色名，不用歧义代词；不得输出分析报告、关键词串或表单。"
    avoid_when: "内部推理、诊断或知识库维护场景。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "07:规则01"
      - "07:规则11"

  - id: "PROMPT-TIMEZERO-002"
    title: "单独片段时间轴从 0 秒开始"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "编译单个生成片段的时间轴。"
    instruction: "每个独立生成片段的时间轴都从 0 秒开始，不继承全片绝对时间。"
    avoid_when: "输出全片级时间表或剪辑总表。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "07:规则03"

  - id: "PROMPT-REF-003"
    title: "参考图先绑定再进时间轴"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "存在人物参考图、场景参考图、尾帧或视频参考。"
    instruction: "人物参考图先绑定身份和外观，场景参考图只负责环境空间；参考调用放在合适位置，不得污染场景主体。"
    avoid_when: "没有参考图或参考图与当前片段无关。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "07:规则04"
      - "07:规则05"
      - "07:规则08"

  - id: "PROMPT-FIRSTFRAME-004"
    title: "首帧继承优先级"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "使用上一段尾帧、静帧或参考图续接下一段。"
    instruction: "首帧继承只负责延续人物、道具、空间和光线，不得重写上游拆片边界。"
    avoid_when: "上一段生成失败或尾帧与剧本目标严重偏离。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "07:规则07"
      - "07:规则07-1"

  - id: "PROMPT-SHOTBASE-005"
    title: "每个时间段先立分镜基底"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "编译时间轴内的每个主分镜或时间段。"
    instruction: "每个时间段必须先用自然语言建立主体、景别、机位、空间和动作基底，再写子分镜变化。"
    avoid_when: "已经处在同一时间段内部的连续子动作，不需要重复完整基底。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "07:规则09"
      - "07:规则09-1"

  - id: "PROMPT-ACTION-006"
    title: "一镜一主动作"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "编译一个镜头或一个连续生成片段。"
    instruction: "同一镜头只写一个主动作，多人同句时避免歧义代词，并在关键动作后补表情锚点。"
    avoid_when: "群戏需要同时呈现背景群体动作时，主动作仍需单独突出。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
