    source_rules:
      - "07:规则11-4"
      - "07:规则11-5"
      - "07:规则08-16"

  - id: "PROMPT-FAST-008"
    title: "禁止三快叠加"
    owner_agent: "prompt_compiler"
    priority: "P1"
    applies_when: "提示词里出现快速主体动作、快速运镜、复杂环境或高强度剪辑。"
    instruction: "快只能快一个维度；不得同时让主体动作快、摄影机快、环境复杂度高。"
    avoid_when: "无例外；若必须表现混乱，优先降低环境复杂度或改用短反应/空镜承接。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/00_知识库优先级与冲突裁决规则.md"
    source_rules:
      - "07:规则13"
      - "07:规则14"

  - id: "PROMPT-LIGHT-009"
    title: "光线一致性优先"
    owner_agent: "prompt_compiler"
    priority: "P1"
    applies_when: "提示词描述场景光线、风格、时间和氛围。"
    instruction: "光线比空泛形容词更重要；不得出现冷暖、方向、强弱或风格互相矛盾的光线描述。"
    avoid_when: "确有双光源或舞台式光线时，必须明确主光和辅助光关系。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "07:规则17"
      - "07:规则18"
      - "07:规则19"

  - id: "RHYTHM-BEAT-001"
    title: "片段内部先判断节拍功能"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "改写或组织片段内部时间轴。"
    instruction: "先判断当前节拍是建立、预压、逼近、炸点、受击、压入、停顿还是收束，再决定节奏写法。"
    avoid_when: "纯技术编译阶段，节拍已由上游明确给出。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:规则01"

  - id: "RHYTHM-EVENT-002"
    title: "事件关系模型"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "同一片段内有多个事件、动作或信息点。"
    instruction: "必须判断事件之间是并列、递进、打断还是压入，并据此组织节拍顺序。"
    avoid_when: "只有单一动作单元且没有新信息进入。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:规则03"
      - "15:规则04"

  - id: "RHYTHM-WEIGHT-003"
    title: "节拍长短服务戏剧重量"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "需要安排停顿、反应、解释或推进速度。"
    instruction: "节拍长短必须服从戏剧重量；炸点后不要急着解释完，受击段先写人怎么被击中。"
    avoid_when: "低权重过场信息，不应过度停顿。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:规则07"
      - "15:规则12"
      - "15:规则13"

  - id: "RHYTHM-ASL-001"
    title: "ASL 级差跳跃"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "15 秒片段内部需要形成观看节奏变化。"
    instruction: "每个 15 秒片段内部的平均镜头时长应至少出现一次级差跳跃，避免全程同速。"
    avoid_when: "单镜头长动作片段需要连续呈现，可用内部动作节拍替代剪辑级差。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:R-01"

  - id: "RHYTHM-ASL-002"
    title: "微短剧 ASL 基准"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "评估微短剧片段整体剪辑密度。"
    instruction: "微短剧整体 ASL 基准锚定在 1.5-3.5 秒，但不得把全程高能当成默认美学。"
    avoid_when: "建立空间、长情绪停顿或复杂动作需要更长镜头。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:R-02"
      - "15:R-03"

  - id: "RHYTHM-REACTION-MIN-001"
    title: "反应镜头最低停留"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "信息揭示、受击、反转或人物情绪被击中后。"
    instruction: "剧情受击型反应镜头最低停留 1.5 秒，重要信息可保留 1.5-2.5 秒回味。"
    avoid_when: "只是剪辑遮挡型听者补帧，可交由 shot_director 按 CUT-REACTION-001 缩短。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:R-04"
      - "15:R-05"

  - id: "MOTION-RHYTHM-001"
    title: "固定机位也是强决策"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "判断节拍是否需要运镜介入。"
    instruction: "先判断是否需要运镜，再判断用什么运镜；固定机位本身可以表达压迫、稳定、权力或停顿。"
    avoid_when: "人物运动、注意力转移或新事件压入需要摄影机带动观众视线。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:规则01"
      - "15:规则02"

  - id: "MOTION-RHYTHM-002"
    title: "运镜必须绑定节拍功能"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "推、拉、跟随、横移、摇摄等运镜进入时间轴。"
    instruction: "运镜介入必须与建立、预压、逼近、炸点、受击、压入、停顿或收束等节拍功能绑定。"
    avoid_when: "只是为了电影感或画面变化而添加运镜。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:规则03"
      - "15:规则22"

  - id: "MOTION-RHYTHM-003"
    title: "停顿段通常不动"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "黄金停顿、反应停顿、信息回味或关系断裂后的空白。"
    instruction: "停顿段通常不动，先稳住人物反应和观众消化，不用运镜抢情绪。"
    avoid_when: "停顿同时承担注意力转移或新事件压入。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:规则10"
      - "15:规则19"

  - id: "EMOTION-ANCHOR-001"
    title: "每个时间段必须有情绪锚点"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "每个时间段、主分镜或关键动作段输出时。"
    instruction: "每个时间段至少写一个可见情绪表现锚点，如眼神、呼吸、停顿、手部动作或姿态变化。"
    avoid_when: "纯环境空镜或道具特写，但也应通过环境反应承接情绪。"
    source_files:
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "18:规则01"

  - id: "EMOTION-ANCHOR-002"
    title: "禁止空泛情绪词独立使用"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "提示词中出现震惊、害怕、愤怒、悲伤、暧昧等情绪词。"
    instruction: "情绪词必须落到可见表演动作或身体反应，不得单独作为模型执行指令。"
    avoid_when: "无例外；抽象情绪必须翻译成可拍动作。"
    source_files:
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
      - "knowledge/14_动作描述精细化控制规则.md"
    source_rules:
      - "18:规则02"
      - "18:规则03"

  - id: "PROMPT-NOSUBTITLE-001"
    title: "对白禁止字幕文字"
    owner_agent: "prompt_compiler"
    priority: "P1"
    applies_when: "最终 Seedance prompt 中包含对白、口播或台词引号。"
    instruction: "约束段必须明确禁止字幕、屏幕文字、英文字幕和文字浮层；台词只作为声音或口型存在。"
    avoid_when: "无例外；如需屏幕内道具文字，必须由用户显式要求且与对白字幕区分。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/17_结果质检与回溯修正规则.md"
    source_rules:
      - "07:规则10-2"
      - "17:检查项11"

  - id: "ACTION-COLLISION-001"
    title: "意外碰撞反浪漫化"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "剧本动作是冲入、撞上、扑到、失衡、阻拦或意外身体接触。"
    instruction: "只写短促失衡、稳住手臂/腰侧、重心被拉回和距离恢复；不得写怀里、拥抱、贴身、胸口或亲密对视。"
    avoid_when: "原剧本明确要求拥抱、亲密对视或浪漫肢体互动。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/17_结果质检与回溯修正规则.md"
    source_rules:
      - "06:规则12-3"
      - "17:检查项11"

  - id: "WORKFLOW-SEGMENT-001"
    title: "默认逐段交互工作流"
    owner_agent: "story_planner"
    priority: "P2"
    applies_when: "项目采用逐段生成、上一段尾帧续接下一段的工作流。"
    instruction: "默认按逐段交互执行：先完成当前片段，再基于尾帧或视频分析续接下一片段。"
    avoid_when: "用户明确要求一次性全片规划，或没有逐段生成能力。"
    source_files:
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "18:规则06"
      - "18:规则09"

  - id: "WORKFLOW-TAILFRAME-002"
    title: "尾帧分析覆盖连续性要素"
    owner_agent: "quality_inspector"
    agent_scope:
      - "story_planner"
    priority: "P1"
    applies_when: "上一段生成后需要分析尾帧或视频末帧，并用于下一段首帧继承、连续性续接和不重拆片判断。"
    instruction: "尾帧或视频分析必须覆盖人物位置、动作状态、道具、光线、视线、镜头方向和可继承风险；分析只服务下一段首帧总控与连续性继承，不得反向修改已锁定的拆片骨架、主分镜边界或完整发言单元。"
    avoid_when: "上一段完全失败，应进入返工而不是续接；除非用户明确要求重新拆片、重算边界或重做片段规划，否则不得用尾帧触发重拆。"
    source_files:
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "18:规则07"
      - "18:规则07-1"
      - "18:规则08"
      - "05:规则15-1"
      - "07:规则07-1"

  - id: "CONTINUITY-LOWANGLE-001"
    title: "仰拍限制"
    owner_agent: "quality_inspector"
    agent_scope:
      - "shot_director"
    priority: "P1"
    applies_when: "镜头计划中出现仰拍、低机位、低角度、低视角、low angle、low-angle shot、俯拍、高机位、high angle、平视机位、eye level 或权力高度表达。"
    instruction: "默认机位高度为平视/eye level；仰拍、低位仰拍、略仰视角、low camera angle 只允许在穷举合法场景中使用，一个 15 秒片段最多 1 次；俯拍/high angle 也必须有叙事理由。"
    avoid_when: "儿童、脆弱姿态、地面倒伏、私密身体凝视或模型稳定性不足。"
    source_files:
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "18:规则10"
      - "18:规则11"
      - "18:规则12"
      - "18:规则13"
      - "18:规则14"

  - id: "CONT-PROP-TIMELINE-001"
    title: "道具状态时间线"
    owner_agent: "quality_inspector"
    priority: "P1"
    applies_when: "同一片段或跨片段中角色持物、放物、递物、使用道具。"
    instruction: "约束段必须写明道具状态时间线；单手持物变双手做事时必须写过渡。"
    avoid_when: "道具已经离场或剧情明确丢弃。"
    source_files:
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "18:规则17"
      - "18:规则18"
      - "18:规则19"

  - id: "MULTICAM-NOSTATIC-001"
    title: "禁止呆板正反打默认方案"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "双人对话、对峙或信息交换场景。"
    instruction: "不得默认全程正反打，应按建立、关系、反应、细节和压缩需求组合镜头菜单。"
    avoid_when: "极短发言确认身份时可短暂使用正反打，但不能成为整段默认方案。"
    source_files:
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
    source_rules:
      - "22:规则01"
      - "22:规则02"

  - id: "MULTICAM-ONECAMERA-002"
    title: "AI 多机位生成片段单机位连续拍摄"
    owner_agent: "shot_director"
    agent_scope:
      - "shot_director"
      - "shot_director_layout"
      - "prompt_compiler"
    priority: "P1"
    applies_when: "AI 多机位分镜中，同一动作需要多个角度覆盖，但每个生成片段只能一个机位连续拍摄，单段只保留一两个连贯动作。"
    instruction: "每个生成片段只落在一个机位/镜头类型上并保持连续拍摄；需要多个角度覆盖时，拆成多个生成片段、主分镜或子分镜，并用动作锚点、台词落点、受击反应或视线触发衔接。"
    avoid_when: "15 秒导演片段内部已经按 MULTICAM-MULTISHOT-002 规划为有动机的主分镜/子分镜切换时，不把整条 15 秒片段误压成单一机位；最终 prompt 仍只写单层时间轴。"
    query_terms:
      - "AI 多机位分镜"
      - "同一动作 多个角度覆盖"
      - "每个生成片段 一个机位 连续拍摄"
      - "单段 一两个 连贯动作"
      - "single camera per generated clip"
    signals:
      - "多机位覆盖"
      - "一个机位"
      - "连续拍摄"
      - "生成片段"
      - "单段动作限制"
    source_files:
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
    source_rules:
      - "22:流程C"
      - "22:规则05"
      - "22:一句话总纲"

  - id: "MULTICAM-MULTISHOT-002"
    title: "15 秒导演片段内部保留主分镜/子分镜，最终只写单层时间轴"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "把多机位方案转成 AI 视频生成片段。"
    instruction: "一个 15 秒导演片段内部可以包含多个主分镜/子分镜；最终 Seedance prompt 只写普通时间段，不显式输出主分镜/子分镜标签。"
    avoid_when: "外层动作单元 + 内层子时间轴、多个分镜共享同一时间标记、两个相同景别直接相接，或把整条 15 秒片段误压成单一机位。"
    source_files:
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
      - "knowledge/00_知识库优先级与冲突裁决规则.md"
    source_rules:
      - "22:规则04"

  - id: "PROMPT-MAIN-SUBSHOT-TIMELINE-001"
    title: "主分镜与子分镜是内部结构，最终输出只写单层时间轴"
    owner_agent: "prompt_compiler"
    priority: "P1"
    applies_when: "编译最终 Seedance prompt，尤其是需要主分镜加子分镜时。"
    instruction: "内部主分镜和子分镜必须映射为同一条时间轴上的普通时间段，每段有独立时间；最终 prompt 不写主分镜/子分镜标签。插入段必须服务上一动作起始镜头或当前动作锚点，并且与前后镜头形成景别、机位或功能差异。"
    avoid_when: "最终 prompt 出现主分镜/子分镜标签；外层动作单元 + 内层子时间轴；无功能硬切；特写接特写、半身中景接半身中景等相同景别直切；把插入段误拆成新剧情事件。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-MAIN-SUBSHOT-TIMELINE-001.md"
      - "knowledge/00_知识库优先级与冲突裁决规则.md"
    source_rules:
      - "PROMPT-MAIN-SUBSHOT-TIMELINE-001"

  - id: "MULTICAM-ACTIONLIMIT-003"
    title: "单段只描述 1-2 个连贯动作"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "AI 视频生成片段包含人物动作、摄影机运动和多角色互动。"
    instruction: "单段只描述 1-2 个连贯动作，复杂动作拆成多个片段或多机位覆盖。"
    avoid_when: "无例外；复杂度超限优先拆动作而不是堆提示词。"
    source_files:
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "22:规则05"

  - id: "MULTICAM-REFERENCE-004"
    title: "人物参考图保障多机位一致性"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "同一人物需要跨多个机位或多个生成片段保持一致。"
    instruction: "人物参考图是多机位一致性的关键，必须稳定绑定角色身份、外观和服装，不随机替换称谓。"
    avoid_when: "没有可用参考图时，必须用文字约束降低外观漂移。"
    source_files:
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "22:规则06"

  - id: "MULTICAM-ERRORREDUCE-005"
    title: "利用机位切换减少模型出错"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "动作过程冗长、走路填时长、复杂转身或模型容易漂移。"
    instruction: "用机位切换省略垃圾时间和高风险动作过程，把每段保留在模型更容易稳定生成的动作范围内。"
    avoid_when: "切换会破坏动作锚点、方向连续或主分镜骨架。"
    source_files:
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
    source_rules:
      - "22:规则07"

  - id: "RHYTHM-SIGNAL-TAXONOMY-001"
    title: "短剧戏剧微粒识别表"
    owner_agent: "story_planner"
    priority: "P2"
    applies_when: "story_planner 拆片前需要判断片段的主戏剧微粒、Hook 权重、受击空间和边界原因。"
    instruction: "先识别主戏剧微粒，再输出 rhythm_function、hook_weight、script_basis、boundary_reason 和 reaction_need；每个片段最多保留 1 个主信号和 1 个次级信号，不得提前下镜头执行指令。"
    avoid_when: "不得在 story_planner 阶段提前写具体景别、机位或运镜。"
    source_files:
      - "knowledge/24_戏剧微粒识别与节奏触发规则.md"
      - "knowledge/15_故事节奏控制规则.md"
      - "knowledge/rules/story_planner/RHYTHM-SIGNAL-TAXONOMY-001.md"
    source_rules:
      - "report:交付物二"

  - id: "SHOT-RHYTHM-SIGNAL-MAPPING-001"
    title: "节奏信号到镜头语言映射"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "shot_director 已收到上游 rhythm_function，需要把节奏功能转成镜头语言。"
    instruction: "根据节奏信号决定镜头压力、受击窗口、Micro-Pause、尾帧阻断和关系收束方式，并说明 shot_language_reason、rhythm_basis、script_basis 和 why_not_template。"
    avoid_when: "没有 script_basis 的片段不得套用高能爆点镜头。"
    source_files:
      - "knowledge/24_戏剧微粒识别与节奏触发规则.md"
      - "knowledge/15_故事节奏控制规则.md"
      - "knowledge/rules/shot_director/SHOT-RHYTHM-SIGNAL-MAPPING-001.md"
    source_rules:
      - "report:交付物三"
      - "report:交付物四"

  - id: "SHOT-COMPLEX-ACTION-DEGRADE-001"
    title: "复杂物理动作必须蒙太奇降级"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "剧本出现击打、推搡、抢夺、多人混乱、倒地、强拉强拽或高风险身体接触。"
    instruction: "不得把完整物理接触塞进一个镜头；拆为动作前摇、冲击切出、受击反应和结果暗示，优先用反应与声音补偿真实碰撞。"
    avoid_when: "简单低风险动作可按普通动作锚点处理，但仍遵守一镜一主动作。"
    source_files:
      - "knowledge/rules/shot_director/SHOT-COMPLEX-ACTION-DEGRADE-001.md"
    source_rules:
      - "report:交付物三"
      - "report:深度解剖案例1"

  - id: "SHOT-DIALOGUE-PAUSE-001"
    title: "长对白必须切出气口"
    owner_agent: "shot_director"
    priority: "P2"
    applies_when: "单句对白超过 15 个中文字符、预计发音超过 4 秒，或高压对白连续密集出现。"
    instruction: "只在原文标点或完整短语边界拆分对白，并插入 1.0-2.5 秒听者反应、道具插入或停顿气口；拼回后必须与原对白一致。"
    avoid_when: "短促低权重对白不应被过度切碎。"
    source_files:
      - "knowledge/rules/shot_director/SHOT-DIALOGUE-PAUSE-001.md"
    source_rules:
      - "report:交付物四"
      - "report:Rule Card RC_01"

  - id: "PROMPT-CONSTRAINT-POLARITY-001"
    title: "约束集中写入且时间轴正向表达"
    owner_agent: "prompt_compiler"
    priority: "P1"
    applies_when: "最终 prompt 同时包含硬约束、时间轴和对白/人物/场景连续性要求。"
    instruction: "硬约束集中写入【核心禁忌】或【约束】；时间轴内部改用正向可见状态表达，不在每段末尾重复禁忌串。"
    avoid_when: "含对白时仍必须保留禁止字幕与屏幕文字的最终硬约束句。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-CONSTRAINT-POLARITY-001.md"
    source_rules:
      - "report:交付物八"

  - id: "PROMPT-AXIS-LOCK-PER-SEGMENT-001"
    title: "单片段内摄影机必须始终在 180° 轴线同侧"
    owner_agent: "prompt_compiler"
    priority: "P0"
    applies_when: "编译最终 Seedance prompt，单段内同时出现多个机位描述、双人关系镜头或反打需求。"
    instruction: "每个 segment 必须在开头明确轴线方向并选定摄影机一侧（左/中/右），整段 prompt 内不得跨到另一侧；真要反打必须由 story_planner 拆段，并通过人物自然转身、越轴中性镜头或 scene_fixed 机位作为过渡。"
    avoid_when: "单段出现人物相对的“左前方/右前方/左后方/右后方”、单段出现“反打至/反打镜头/翻拍至”、用“同一机位继续”承接反向机位描述。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-AXIS-LOCK-PER-SEGMENT-001.md"
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "PROMPT-AXIS-LOCK-PER-SEGMENT-001"

  - id: "PROMPT-CUT-BUDGET-001"
    title: "单片段切镜预算（含隐性切镜识别）"
    owner_agent: "prompt_compiler"
    priority: "P0"
    applies_when: "编译最终 Seedance prompt，需要在单段内安排多个镜头变化、机位切换或主体焦点切换。"
    instruction: "按 segment 时长执行切镜预算：≤3 秒禁止切镜；3-8 秒最多 1 次；8-13 秒最多 2 次；13-15 秒最多 3 次。超出预算必须由 story_planner 重新拆段，禁止 compiler 自行硬塞或缩短时长绕开预算。识别“同一机位继续”后 60 字内若引入新主体名+新景别（中景/特写/中近景等）即判为隐性切镜并算入总数。"
    avoid_when: "用“同一机位继续/镜头保持/机位不变”作为隐性切镜的伪装；把超过预算的事件全塞进单段；通过缩短 segment 时长来绕开预算上限。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-CUT-BUDGET-001.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/rules/prompt_compiler/PROMPT-CINEMATIC-DOWNTRANSLATION-002.md"
    source_rules:
      - "PROMPT-CUT-BUDGET-001"

  - id: "PROMPT-FIRST-FRAME-PIXEL-LOCK-001"
    title: "首帧锁必须含像素锚点（不只人物相对位置）"
    owner_agent: "prompt_compiler"
    priority: "P0"
    applies_when: "编译最终 Seedance prompt 的【空间与首帧总控】段，或写 scene_lock.first_frame_lock / main_shots[0].first_frame 字段。"
    instruction: "首帧描述必须同时包含至少 2 类像素锚点（A 主体像素位置 / B 背景锚点像素位置 / C 构图比例），例如“画面中央”“占画面高度 1/2”“胸口对齐画面纵向 1/2 处”“电梯门框位于画面远端中央”等；前一段尾帧像素描述与下一段首帧像素描述必须逐字对齐。"
    avoid_when: "只写“X 位于中轴入口方向”这种纯人物相对场景的描述；只写“X 在画面前方/后方”这种深度方向无像素锚的描述；首帧锚点和后续段尾帧锚点用不同的像素描述体系。"
    source_files:
      - "knowledge/rules/prompt_compiler/PROMPT-FIRST-FRAME-PIXEL-LOCK-001.md"
      - "knowledge/11_场景分析输入卡与导演意图提取.md"
      - "knowledge/rules/scene_analyst/SCENE-CONSISTENCY-LOCK-001.md"
      - "knowledge/rules/prompt_compiler/REF-TAILFRAME-PRIORITY-001.md"
    source_rules:
      - "PROMPT-FIRST-FRAME-PIXEL-LOCK-001"

  - id: "QC-PACING-SAFETY-CHECKLIST-001"
    title: "节奏与物理安全质检清单"
    owner_agent: "quality_inspector"
    priority: "P0"
    applies_when: "quality_inspector 检查 shot_director 或 prompt_compiler 输出。"
    instruction: "逐项检查对白完整性、首镜 Hook、首 3 秒空转、连续长镜头、高潮对白密度、受击窗口、单镜上限、复杂动作同镜风险、约束污染和 Cliffhanger 释怀问题；失败时给出具体返修方向。"
    avoid_when: "不得只输出笼统的“节奏不好”或“需优化”。"
    source_files:
      - "knowledge/24_戏剧微粒识别与节奏触发规则.md"
      - "knowledge/15_故事节奏控制规则.md"
      - "knowledge/rules/quality_inspector/QC-PACING-SAFETY-CHECKLIST-001.md"
    source_rules:
      - "report:交付物八"

  - id: "RHYTHM-HOOK-OPEN-3S-001"
    title: "首镜 Hook 三秒释放"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "片段开头承担开场钩子、段落钩子或高权重重新抓人任务。"
    instruction: "首镜前 3 秒内必须至少释放高价值信息、关系压力、动作启动或明显情绪信号中的一项；不得把真正的钩子拖到第 4 秒以后。"
    avoid_when: "仅在纯空间继承镜头中可短暂降级，但仍需尽快补上关系、目标物或危险源。"
    source_files:
      - "knowledge/24_戏剧微粒识别与节奏触发规则.md"
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:R-09"

  - id: "SEGMENT-SIGNAL-BOUNDARY-001"
    title: "拆片先判主戏剧微粒与边界理由"
    owner_agent: "story_planner"
    priority: "P2"
    applies_when: "story_planner 在决定片段边界、受击空间和尾拍收束方式之前。"
    instruction: "先判断主戏剧微粒与 Hook 权重，再围绕命中点、受击点、黄金停顿或阻断点决定边界；高权重信号优先于平均时长。"
    avoid_when: "不得先按秒数切开，再回头给片段套节奏名字。"
    source_files:
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
      - "knowledge/24_戏剧微粒识别与节奏触发规则.md"
      - "knowledge/rules/story_planner/RHYTHM-SIGNAL-TAXONOMY-001.md"
    source_rules:
      - "05:15-2"
      - "05:15-3"

  - id: "RHYTHM-SIGNAL-REWRITE-001"
    title: "改写层按戏剧微粒组织 atmosphere_strategy"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "rhythm_rewrite_director 需要把动作层与氛围层改写成下游可执行的节拍建议时。"
    instruction: "先识别主戏剧微粒，再决定 atmosphere_strategy 如何建议停顿、受击、揭示前半拍、权力翻面证据和 Cliffhanger 阻断；只建议，不越权写镜头命令。"
    avoid_when: "不得臆造新人物、新事件、新道具，也不得改写原剧本台词。"
    source_files:
      - "knowledge/09_节奏总控与剧本改写规则.md"
      - "knowledge/24_戏剧微粒识别与节奏触发规则.md"
      - "knowledge/rules/rhythm_rewrite_director/RHYTHM-SIGNAL-REWRITE-001.md"
    source_rules:
      - "09:18"
      - "09:19"
      - "09:20"
      - "09:21"
      - "09:22"

  - id: "RHYTHM-CUTTING-TEMPO-HANDOFF-002"
    title: "快切、慢叙述与弹性片段时长交接"
    owner_agent: "rhythm_rewrite_director"
    agent_scope:
      - "story_planner"
      - "shot_director"
      - "quality_inspector"
    priority: "P0"
    applies_when: "节奏总控需要把哪里快切、哪里慢停、哪里用长镜头、哪里允许短段明确传给拆片和镜头导演。"
    instruction: "给下游只输出任务清单，不输出解释段落；必须包含 segment_duration_policy、story_planner_tasks、shot_director_tasks 和 quality_check_tasks。每条任务写清秒数、边界、保留事件、省略事件、切点、反应归属和尾帧状态。story_planner_tasks 要写是否拆 4-10 秒短段、short_segment_reason、keep_events、omit_events；shot_director_tasks 要写快切如何进行：2-3 个镜头、每镜 1-2 秒、动作 50%-70% 切出、下一镜从 30%-50% 接续、切受击者/关键道具/动作结果；慢叙述如何进行：1 个稳定主镜头、必要时 1 个反应镜头、主停顿 1.5-3 秒、只拍呼吸/视线/姿态/道具状态变化。普通段仍优先 13-15 秒，高密度快切、钩子阻断、动作压入或切镜预算超载时允许 4-10 秒短段。"
    avoid_when: "禁止只写“快/慢/电影感/更紧张”；禁止把快切误写成快速运镜+快速动作+复杂背景三快叠加；禁止把慢叙述写成空镜拖时长或无信息慢走；禁止切断完整发言单元。"
    source_files:
      - "knowledge/rules/rhythm_rewrite_director/RHYTHM-CUTTING-TEMPO-HANDOFF-002.md"
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
      - "knowledge/15_故事节奏控制规则.md"
      - "knowledge/rules/shot_director/SHOT-RHYTHM-SIGNAL-MAPPING-001.md"
      - "knowledge/rules/prompt_compiler/PROMPT-CUT-BUDGET-001.md"
    source_rules:
      - "RHYTHM-CUTTING-TEMPO-HANDOFF-002"

  - id: "RHYTHM-MICRO-PAUSE-001"
    title: "高压段必须切出 Micro-Pause"
    owner_agent: "shot_director"
    priority: "P3"
    applies_when: "密集语言对峙、真相揭晓、情绪临界、误会加深或反转命中前后。"
    instruction: "每轮关键台词交锋之间，必须插入 1.0-2.5 秒的反应镜头、关系镜头、道具插入或沉默停顿，让观众完成理解、受击和期待下一击。"
    avoid_when: "禁止用无意义走路、转身、空镜旅游或泛泛慢推冒充停顿。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
      - "knowledge/rules/shot_director/SHOT-DIALOGUE-PAUSE-001.md"
      - "knowledge/rules/quality_inspector/QC-PACING-SAFETY-CHECKLIST-001.md"
    source_rules:
      - "15:R-11"

  - id: "QC-FIRST-SHOT-4S-001"
    title: "首镜超过四秒的节奏报警"
    owner_agent: "quality_inspector"
    priority: "P0"
    applies_when: "高权重片段的首镜超过 4 秒，且尚未释放 Hook。"
    instruction: "若首镜超过 4 秒仍停留在空转、解释或中性站位，默认判为 fail，并要求缩首镜或提前释放高价值信息。"
    avoid_when: "只有纯空间继承、且无法更早给出关系或危险线索时，才允许降为 warn。"
    source_files:
      - "knowledge/17_结果质检与回溯修正规则.md"
      - "knowledge/rules/quality_inspector/QC-PACING-SAFETY-CHECKLIST-001.md"
    source_rules:
      - "17:12"

  # ========== shot_director_blocking 规则 ==========

  - id: "BLOCKING-PARENT-SUBSHOT-001"
    title: "子分镜必须挂靠 parent_shot_id"
    owner_agent: "shot_director_blocking"
    priority: "P2"
    applies_when: "动作调度导演在已有主分镜骨架上补充子分镜时。"
    instruction: "每个 sub_shot 必须包含 parent_shot_id 字段，且必须指向当前片段内已存在的 shot_id；不允许出现漂浮子分镜。"
    avoid_when: "无例外；漂浮子分镜在下游编译和质检中会被视为结构错误。"
    source_files:
      - "knowledge/26_动作调度与受击覆盖规则.md"
    source_rules:
      - "26:三、sub_shots 规则"

  - id: "BLOCKING-REACTION-COVERAGE-002"
    title: "reaction_coverage 必须明确落到主镜头或子镜头"
    owner_agent: "shot_director_blocking"
    priority: "P2"
    applies_when: "动作调度导演为每个片段补齐 reaction_coverage 时。"
    instruction: "reaction_coverage 必须明确写出受击或信息冲击落在当前片段的哪个 shot_id；不允许写“有受击反应”而不给出具体落点。"
    avoid_when: "纯环境交代片段可以写“无需受击覆盖”，但必须显式声明。"
    source_files:
      - "knowledge/26_动作调度与受击覆盖规则.md"
    source_rules:
      - "26:二、reaction_coverage 写法"

  - id: "BLOCKING-DIALOGUE-FIDELITY-003"
    title: "对白只允许引用原剧本，不得补写"
    owner_agent: "shot_director_blocking"
    priority: "P1"
    applies_when: "动作调度导演在补齐对白落点和 dialogue_coverage 时。"
    instruction: "dialogue_coverage 只能引用原始剧本中的台词原文；不允许缩写、改写、意译或新增剧本中没有出现过的台词。"
    avoid_when: "无例外；凡带引号的台词都必须能在原剧本中逐字找到。"
    source_files:
      - "knowledge/26_动作调度与受击覆盖规则.md"
      - "knowledge/04_对白与表演镜头规则.md"
    source_rules:
      - "26:四、对白覆盖原则"

  - id: "BLOCKING-CUT-ANCHOR-TIMING-004"
    title: "子分镜切镜必须有动作或信息锚点"
    owner_agent: "shot_director_blocking"
    priority: "P1"
    applies_when: "动作调度导演在已有主镜头下新增 sub_shots、reaction_coverage 或 dialogue_coverage。"
    instruction: "新增子分镜必须命中动作、视线、信息、权力或声音锚点；动作匹配剪辑切在中间态；承担命令、威胁、揭示的完整发言单元不要被无信息增量的脸部特写打碎。"
    avoid_when: "如果只是眉头、眼神或表情微变，优先留在父级主镜头内表演，不新增子分镜。"
    source_files:
      - "knowledge/26_动作调度与受击覆盖规则.md"
      - "knowledge/28_全场景分镜与转场案例库.md"
    source_rules:
      - "26:七、从 28 号案例库提炼的切镜与子分镜纪律"

  - id: "BLOCKING-STATE-DELTA-005"
    title: "动作调度必须写状态推进和切点"
    owner_agent: "shot_director_blocking"
    priority: "P1"
    applies_when: "动作调度导演补齐 main_shots 的状态推进，或新增 sub_shots 承接动作、台词、视线、手部、门/道具状态。"
    instruction: "每个主镜头补 state_delta；每个子分镜补 cut_point、companion_visibility 和 state_delta。状态必须单向推进，切点必须绑定台词落点、动作中间态、视线撞上或动作顶点前。"
    avoid_when: "如果状态确实不变，也必须写“保持”，避免下游误造变化。"
    source_files:
      - "knowledge/26_动作调度与受击覆盖规则.md"
      - "knowledge/03_镜头切换与推进规则.md"
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/20_镜头库与机位库.md"
    source_rules:
      - "26:八、全库检索后补入的覆盖执行字段"

  - id: "BLOCKING-ACTION-FLOW-006"
    title: "动作导演必须交付动作流程表与事件覆盖表"
    owner_agent: "shot_director_blocking"
    priority: "P1"
    applies_when: "动作调度导演需要把一号主分镜骨架翻译成可执行动作流程，尤其是对峙、压迫、受击、多人散开、门口/电梯阈值段、闭环收束等片段。"
    instruction: "每个 fragment 至少补齐 blocking_plan、state_chain、event_coverage；state_chain 要把手、门、道具、站位、距离、群体状态写成单向变化链；event_coverage 要逐条把 source_script_events 挂到具体镜头。若存在 sub_shots，还必须补 duration_hint 与 action_phase，避免把短重音写成新的主镜头。"
    avoid_when: "不得为了补这几张表重做 layout，不得改 shot_id 编号，不得新造剧本外事件。"
    source_files:
      - "knowledge/26_动作调度与受击覆盖规则.md"
      - "knowledge/28_全场景分镜与转场案例库.md"
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/rules/shot_director_blocking/BLOCKING-ACTION-FLOW-006.md"
    source_rules:
      - "26:九、动作导演必须交付三张表"

  # ========== shot_director_guard 规则 ==========

  - id: "GUARD-MINIMAL-REPAIR-001"
    title: "只修硬伤，不重写方案"
    owner_agent: "shot_director_guard"
    priority: "P2"
    applies_when: "规则守门导演审查前两位导演的产出，决定是否修改时。"
    instruction: "只修复会导致下游报错或质检 fail 的硬伤；不重写镜头创意、不另起炉灶。"
    avoid_when: "无例外；如果前两位导演的方案没有硬伤，守门导演的输出应当与输入几乎一致。"
    source_files:
      - "knowledge/27_规则守门与最小修复规则.md"
    source_rules:
      - "27:三、最小修复原则"

  - id: "GUARD-STRUCTURE-PRESERVE-002"
    title: "优先保留主结构与编号"
    owner_agent: "shot_director_guard"
    priority: "P2"
    applies_when: "规则守门导演修复镜头方案时，需要决定是否改动 fragment_id、shot_id 或 main_shots 结构。"
    instruction: "fragment_id 顺序不变、shot_id 保持前两位导演给出的编号、已有的 main_shots 除非存在严重结构错误否则保留。"
    avoid_when: "只有当 shot_id 存在真正冲突（重复编号、指向错误）时，才允许最小范围重编。"
    source_files:
      - "knowledge/27_规则守门与最小修复规则.md"
    source_rules:
      - "27:四、结构保持规则"

  - id: "GUARD-FIDELITY-VERTICAL-003"
    title: "优先修复剧本忠实度与竖屏纪律"
    owner_agent: "shot_director_guard"
    priority: "P1"
    applies_when: "规则守门导演发现多类问题时，需要决定修复优先级。"
    instruction: "剧本外元素必须立即删除；9:16 竖屏下一个片段内不允许所有主镜头都是面部特写，特写型主镜头最多 1 个。"
    avoid_when: "16:9 横屏画幅下特写限频可适当放宽，但剧本忠实度规则无例外。"
    source_files:
      - "knowledge/27_规则守门与最小修复规则.md"
      - "knowledge/02_焦段景深与景别画幅策略.md"
    source_rules:
      - "27:六、竖屏纪律守门"

  - id: "GUARD-SPATIAL-RESET-BUDGET-004"
    title: "必须修复空间重置和特写偷时间"
    owner_agent: "shot_director_guard"
    priority: "P1"
    applies_when: "规则守门导演发现切镜前后人物位置跳变、让路关系漂移、关系镜头被单人大头吞掉，或下一个事件的时间预算被特写占用。"
    instruction: "把无解释的位置跳变判为硬伤；画面侧边让路位不得无动作解释变成主角身后或并排行走；9:16 大头特写不得吞掉群体反应、台词落点或空间交代时间，必要时改回肩部以上、胸口以上、半身或双层关系中景。"
    avoid_when: "只有剧本明确进入梦境、错觉或主观空间错乱时，才允许破坏空间连续，但必须显式标注动机。"
    source_files:
      - "knowledge/27_规则守门与最小修复规则.md"
      - "knowledge/28_全场景分镜与转场案例库.md"
    source_rules:
      - "27:九、从 28 号案例库提炼的镜头语法守门清单"

  - id: "GUARD-COVERAGE-CONTRACT-005"
    title: "最终镜头方案必须具备覆盖合同"
    owner_agent: "shot_director_guard"
    priority: "P1"
    applies_when: "规则守门导演审查最终 shot_director YAML，准备交给 prompt_compiler。"
    instruction: "最终 YAML 必须具备 coverage_role、cut_reason、companion_visibility、state_delta 和 tailframe_role；缺字段时只给已有镜头最小补齐，尾镜头若是局部/单人必须回到可继承关系景或明确空间状态。"
    avoid_when: "不得为了补字段重写剧本、重排 shot_id 或新增剧本外动作。"
