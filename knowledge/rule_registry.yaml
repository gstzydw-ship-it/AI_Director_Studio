  - id: "SCENE-CONSISTENCY-LOCK-001"
    title: "场景一致性锁写入 state_contract"
    owner_agent: "scene_analyst"
    priority: "P1"
    applies_when: "scene_analyst 给出场景输入卡时同步初始化 state_contract 前置状态。"
    instruction: "必须产出 scene_lock，锁定 wardrobe / props / lighting / time_of_day / axis / gaze_network 六组字段，供 story_planner 复制为片段 entry_state。"
    avoid_when: "不得留空任一组字段；不得输出互相矛盾的锁值；无剧本或参考图支撑的细节必须标 inferred=true。"
    source_files:
