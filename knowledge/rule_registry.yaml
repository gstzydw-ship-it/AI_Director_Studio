version: "2026-04-17"
runtime_retrieval: false
status: canonical_rule_registry
purpose: "为 AI Director Studio 的多 Agent 导演团队提供可追踪、可裁决、可检测的正式规则索引。"

usage:
  - "本文件是规则索引，不替代各知识库正文。执行细节仍以 source_files 中的正式文件为准。"
  - "当正文规则重复、编号冲突或表述强弱不一致时，优先使用本注册表中的 owner_agent、priority、applies_when 和 avoid_when 判断归属。"
  - "runtime_retrieval:false 的原始材料不得直接注册为可执行规则，只能作为 source_files 的提炼来源。"

coverage_targets:
  - file: "knowledge/02_焦段景深与景别画幅策略.md"
    min_rules: 4
  - file: "knowledge/03_镜头切换与推进规则.md"
    min_rules: 4
  - file: "knowledge/05_剧本拆分与15秒片段规划规则.md"
    min_rules: 5
  - file: "knowledge/06_连续性与安全规则.md"
    min_rules: 5
  - file: "knowledge/07_Seedance输出词典与模型适配.md"
    min_rules: 6
  - file: "knowledge/15_故事节奏控制规则.md"
    min_rules: 7
  - file: "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    min_rules: 5
  - file: "knowledge/22_多机位分镜与镜头多样性规则.md"
    min_rules: 4
  - file: "knowledge/24_戏剧微粒识别与节奏触发规则.md"
    min_rules: 3
  - file: "knowledge/25_镜头摆位主分镜骨架规则.md"
    min_rules: 3
  - file: "knowledge/26_动作调度与受击覆盖规则.md"
    min_rules: 3
  - file: "knowledge/27_规则守门与最小修复规则.md"
    min_rules: 3

  - file: "knowledge/29_多机位体系与预算降级规则.md"
    min_rules: 4
  - file: "knowledge/30_画幅镜头映射与竖屏专用镜头规则.md"
    min_rules: 4
  - file: "knowledge/31_程序化镜头表结构与跨片段节奏规则.md"
    min_rules: 4

owner_agents:
  scene_analyst: "识别场景、人物、关系、空间和导演意图，不拆片、不改写、不下最终镜头指令。"
  story_planner: "负责 15 秒片段、时间预算、出入画、省略位移和主分镜骨架。"
  rhythm_rewrite_director: "负责文字层面的动作锚点、情绪阶段、节奏压缩和氛围改写。"
  shot_director: "负责机位、景别、构图、焦点、反拍、转场和画面执行。"
  shot_director_layout: "只负责主分镜骨架、fragment_intent、continuity_anchor 和 main_shots 的稳定交接，不负责 reaction_coverage 与 sub_shots。"
  shot_director_blocking: "只负责在已有主分镜骨架上补齐 reaction_coverage、sub_shots 和对白落点，不推翻骨架、不新增剧本外内容。"
  shot_director_guard: "只做最小必要修复，优先保留 fragment_id、shot_id 和 main_shots 结构，重点检查结构缺项、剧本忠实度、事件漏覆盖和竖屏纪律。"
  prompt_compiler: "只把已定导演决策翻译成模型可执行 prompt，不发明新规则。"
  quality_inspector: "检查连续性、可生成性、规则冲突、遗漏和输出可执行性。"

priority_legend:
  P0: "用户显式要求与安全边界"
  P1: "连续性与模型可生成性"
  P2: "片段边界与主分镜合法性"
  P3: "故事节奏与剧本层改写"
  P4: "镜头调用、多机位与视觉风格"
  P5: "范例、案例与源材料"

rules:
  - id: "ACT-MATCH-001"
    title: "Match-on-Action 动作匹配剪辑"
    owner_agent: "shot_director"
    priority: "P3"
    applies_when: "同一连续动作跨机位、跨景别或跨空间衔接；开门、转身、手触碰门把、道具离手等动作锚点需要匹配剪辑。"
    instruction: "围绕动作锚点做 Match-on-Action：上一镜在动作完成 50%-70% 处切出，下一镜从动作完成 30%-50% 处接续，保持手、脚、身体重心、门把和道具运动方向连续。"
    avoid_when: "需要刻意制造跳切、精神错乱或时空断裂感。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
      - "knowledge/23_视频教学提取_全场景分镜与转场库.md"
    source_rules:
      - "21:R-014"

  - id: "ACT-ANCHOR-002"
    title: "动作锚点定位"
    owner_agent: "shot_director"
    priority: "P3"
    applies_when: "同一动作需要多机位覆盖、单机位拼接或开门转身等动作匹配剪辑；剪辑点容易因角度差异产生跳跃、卡顿或断档。"
    instruction: "选取手触碰门把/物体、门把转动、脚落地、道具离手等关键帧作为所有机位的对齐剪辑点；与 Match-on-Action 配套使用：上一镜在动作 50%-70% 切出，下一镜从 30%-50% 接续，保证同一动作锚点附近无缝衔接。"
    avoid_when: "动作没有明确物理接触点时，改用身体重心变化、视线转向或动作中间态作为锚点。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
      - "knowledge/23_视频教学提取_全场景分镜与转场库.md"
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
    source_rules:
      - "21:R-015"
      - "23:动作锚点定位法"
      - "22:多机位切换触发必须由动作锚点、台词落点、受击反应、视线或空间调度触发"

  - id: "ACT-DIRECTION-003"
    title: "方向匹配规则"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "角色或物体在连续镜头中移动、追逐、转身、出入画或跨空间衔接。"
    instruction: "运动方向必须跨镜头保持一致；若方向必须反转，先用停顿、转身、视线回望或空镜解释方向变化。"
    avoid_when: "精神错乱、梦境、幻觉等场景可以在明确标注后破坏方向连续。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
      - "knowledge/06_连续性与安全规则.md"
    source_rules:
      - "21:R-016"

  - id: "ACT-POSITION-004"
    title: "位置匹配规则"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "景别变化、双人对话、正反打或动作连续。"
    instruction: "景别变化时角色在画面左右位置保持恒定，不得无解释瞬移。"
    avoid_when: "需要表现主观迷失、幻觉或空间错乱时，由 rhythm_rewrite_director 先标注心理动机。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
      - "knowledge/06_连续性与安全规则.md"
    source_rules:
      - "21:R-017"

  - id: "LAYOUT-CONTRACT-001"
    title: "主分镜骨架阶段只输出主镜头合同"
    owner_agent: "shot_director_layout"
    priority: "P2"
    applies_when: "一号镜头摆位导演正在为片段先搭主分镜骨架，需要给后续动作调度导演稳定交接。"
    instruction: "本阶段只输出 fragment_id、fragment_intent、continuity_anchor 和 main_shots；不要提前输出 reaction_coverage、sub_shots 或任何细节反应调度。"
    avoid_when: "如果任务已经进入动作补齐或规则守门阶段，应交给 shot_director_blocking / shot_director_guard，而不是继续扩写骨架。"
    source_files:
      - "knowledge/25_镜头摆位主分镜骨架规则.md"
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
    source_rules:
      - "25:三、输出合同"

  - id: "LAYOUT-SHOTID-002"
    title: "主分镜骨架必须先锁定稳定 shot_id"
    owner_agent: "shot_director_layout"
    priority: "P2"
    applies_when: "一号镜头摆位导演输出 main_shots，后续还要由其他 agent 继续挂接子分镜和修复。"
    instruction: "为每个 main_shot 先生成稳定、顺序递增的 shot_id，不要随意跳号、改名或用模糊编号，避免后续 parent_shot_id 无法稳定挂接。"
    avoid_when: "如果当前只是清洗排版或修复错字，不要无意义重排 shot_id。"
    source_files:
      - "knowledge/25_镜头摆位主分镜骨架规则.md"
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "25:三、输出合同"
      - "25:七、和动作调度导演的边界合同"

  - id: "LAYOUT-VERTICAL-003"
    title: "竖屏摆位优先关系镜头而不是特写堆叠"
    owner_agent: "shot_director_layout"
    priority: "P1"
    applies_when: "9:16 竖屏片段的一号镜头摆位阶段，需要先决定主镜头骨架。"
    instruction: "优先用半身、中景和双人关系镜头作为主力骨架；只有剧情真的需要逼近信息或情绪顶点时，才允许把其中一个主镜头压成特写。"
    avoid_when: "如果后续动作调度层已经明确需要单次情绪顶点特写，可以保留一次特写，但不要把多个主镜头都堆成面部特写。"
    source_files:
      - "knowledge/25_镜头摆位主分镜骨架规则.md"
      - "knowledge/02_焦段景深与景别画幅策略.md"
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
    source_rules:
      - "25:五、9:16 竖屏摆位原则"

  - id: "LAYOUT-NO-SANDWICH-CLOSEUP-004"
    title: "主分镜禁止中景特写中景碎切"
    owner_agent: "shot_director_layout"
    priority: "P1"
    applies_when: "9:16 竖屏片段需要表现表情、权力压迫或冷处理，但当前骨架倾向于半身中景、脸部特写、再回同角度半身中景。"
    instruction: "不要把同一主体写成中景到脸部特写再回同一中景的三明治碎切；表情变化优先在半身中景、胸口以上中近景或肩部以上特写内完成，禁止把整张脸贴满画面当常规情绪镜头。"
    avoid_when: "只有当切近带来新的视线目标、动作锚点、权力关系变化、物件信息或强心理压迫时，才允许一次短切近。"
    source_files:
      - "knowledge/25_镜头摆位主分镜骨架规则.md"
      - "knowledge/28_全场景分镜与转场案例库.md"
    source_rules:
      - "25:九、从 28 号案例库提炼的主分镜硬规则"

  - id: "LAYOUT-COVERAGE-BLUEPRINT-005"
    title: "主分镜必须先给镜头覆盖蓝图"
    owner_agent: "shot_director_layout"
    priority: "P1"
    applies_when: "一号镜头摆位导演输出 main_shots，尤其是双人压迫、冷处理、误会撞见、封闭空间对话、群体关系变化。"
    instruction: "每个主镜头必须写 coverage_role、cut_reason、companion_visibility 和 tailframe_role；双人压迫戏优先形成过肩/纵深中近景、反打中近景、双人关系景、动作插入父镜头、尾帧关系复位的覆盖蓝图。"
    avoid_when: "纯单人独白或纯环境建立可以简化 companion_visibility，但仍要写清 tailframe_role 和 cut_reason。"
    source_files:
      - "knowledge/25_镜头摆位主分镜骨架规则.md"
      - "knowledge/02_焦段景深与景别画幅策略.md"
      - "knowledge/03_镜头切换与推进规则.md"
      - "knowledge/20_镜头库与机位库.md"
      - "knowledge/19_Gold_Standard_Prompt范例.md"
    source_rules:
      - "25:十、全库检索后补入的镜头覆盖蓝图规则"

  - id: "TIME-EXIT-001"
    title: "出入画空间压缩法"
    owner_agent: "story_planner"
    priority: "P2"
    applies_when: "角色需要从 A 点移动到 B 点，但中间位移没有叙事价值。"
    instruction: "上一镜角色出画，下一镜角色入画，保持动作方向一致，直接省略中间位移。"
    avoid_when: "中间位移本身包含追逐、阻拦、发现线索或情绪转折。"
    source_files:
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
    source_rules:
      - "05:规则12/14"

  - id: "TIME-JUMP-002"
    title: "Jump-Cut 物理时间压缩"
    owner_agent: "story_planner"
    priority: "P1"
    applies_when: "动作过程冗长但起点和结果有叙事价值；需要 jump cut、时间压缩、跳切、出入画、A 点到 B 点或重复物理过程省略。"
    instruction: "仅保留动作起点帧和终点帧，压缩重复物理过程；用清晰的起点/终点画面交代位移或结果，不把无信息量过程完整拍完。"
    avoid_when: "动作过程本身承载危险、悬念、技巧或情绪递进。"
    source_files:
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
    source_rules:
      - "05:规则12"

  - id: "TIME-THRESHOLD-003"
    title: "高风险阈值段复杂度减法"
    owner_agent: "story_planner"
    priority: "P1"
    applies_when: "电梯口、房门口、车门口、楼梯口、转角等阈值空间内出现到达、门状态变化、冲入或撞入。"
    instruction: "阈值段只保留到达/站定、门尚未合拢、人物进入、门继续合拢等关键状态；省略无叙事增量走路，局部特写最多保留一个，不保留当前无戏份人物。"
    avoid_when: "原剧本明确写了阻门、按开门键、门重新打开或阈值外人物继续参与行动。"
    source_files:
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
      - "knowledge/06_连续性与安全规则.md"
    source_rules:
      - "05:规则14-1"
      - "06:规则12-2"

  - id: "TEXT-DAILY-001"
    title: "起承合日常琐事压缩法"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "日常行为需要表现完整流程但不能占用长时长。"
    instruction: "采用全景起、3-4 个特写承、全景合，压缩琐事过程并保留节奏感。"
    avoid_when: "日常动作承担关键悬念、危险或角色心理变化。"
    source_files:
      - "knowledge/09_节奏总控与剧本改写规则.md"
    source_rules:
      - "09:R-015"

  - id: "RHYTHM-CONFLICT-SPEED-CURVE-001"
    title: "冲突诊断与速度曲线调度"
    owner_agent: "rhythm_rewrite_director"
    agent_scope:
      - "story_planner"
      - "shot_director"
    priority: "P0"
    applies_when: "剧本冲突偏弱、只有概括动作、用户要求节奏更紧或画面调度更明确时；需要先诊断主角目标、阻力、失败代价、时间压力、弱冲突、秘密、误会、隐藏信息、爆点、钩子落点，再给起速点、加速动作、刹车点、再启动点和速度曲线。"
    instruction: "rhythm_rewrite_director 必须先输出 conflict_diagnosis，再输出 speed_curve；允许做 L1 动作层和 L2 调度层增强，但不得把补强写成原文事实；L3 剧情层增强只能标注为需用户确认。"
    avoid_when: "用户明确要求不做节奏增强，或增强会改变剧情事实、人物关系、身份信息、关键台词、关键道具或事件结果。"
    source_files:
      - "knowledge/rules/rhythm_rewrite_director/RHYTHM-CONFLICT-SPEED-CURVE-001.md"
      - "knowledge/09_节奏总控与剧本改写规则.md"
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "RHYTHM-CONFLICT-SPEED-CURVE-001"

  - id: "SCALE-EMOTION-001"
    title: "景别递进式情绪催化"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "关系冲突或情绪逐步升级。"
    instruction: "从中景/OTS 进入近景，再进入特写，用景别压缩制造心理压力。"
    avoid_when: "竖屏特写频率已触发限制，或动作空间需要被观众理解。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "21:R-018"

  - id: "SCALE-CONTRACT-002"
    title: "双向收缩法"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "双方势均力敌对峙。"
    instruction: "同步缩减双方景别，让压力同时逼近两人。"
    avoid_when: "一方明显掌控局面，应改用不对称景别和构图。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "21:R-019"

  - id: "SCALE-REVEAL-003"
    title: "景别拉伸反转法"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "需要用环境信息制造反转。"
    instruction: "先中景跟拍角色行动，再突然拉远揭示被隐藏的环境或第三方信息。"
    avoid_when: "当前片段没有环境反转信息，或拉远会破坏主体清晰度。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "21:R-020"

  - id: "POWER-HEIGHT-001"
    title: "权力高度法则"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "单方压制、权力压制、审判、训斥、威胁或身份碾压；想用仰拍、低机位表现强势方。"
    instruction: "优先用强势方轻微仰拍、弱势方轻微俯拍表达权力差，但默认机位高度仍应先考虑平视；一个 15 秒片段最多一次仰拍。若低机位限制触发，改用画面占比、中心/边缘、遮挡和站位高度表达。"
    avoid_when: "儿童、脆弱姿态、地面倒伏、默认平视更清晰或 15 秒片段内仰拍配额已用尽。"
    conflicts_with:
      - "CONTINUITY-LOWANGLE-001"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "21:R-022"

  - id: "POWER-FRAME-002"
    title: "画框内权力构图"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "需要表现主导者压迫从属者。"
    instruction: "主导者居中并占更大画面面积，从属者靠边缘、低位或被前景部分遮挡。"
    avoid_when: "平等协商、互相试探或关系尚未分出主导。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "21:R-023"

  - id: "FOCUS-RACK-001"
    title: "焦点转移法"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "前景和背景存在信息接力，需要引导观众视线。"
    instruction: "镜头固定，焦点在前景与背景之间转移，完成视线调度。"
    avoid_when: "同一片段已经存在复杂运动、手持晃动或快速动作。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "21:R-026"

  - id: "FOCUS-DEFOCUS-002"
    title: "虚焦心理映射"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "角色失神、震惊、意识游离。"
    instruction: "将焦点从清晰转为模糊，并停留 2-3 秒表现心理失焦。"
    avoid_when: "关键信息必须被观众立即看清，或模型稳定性不足以执行焦点变化。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "21:R-027"

  - id: "AXIS-BREAK-001"
    title: "越轴暗示法"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "需要表现幻觉、精神错乱、梦境或主观空间崩坏。"
    instruction: "只有在剧本层已经标注异常心理状态时，才允许刻意打破 180 度轴线。"
    avoid_when: "普通对话、动作连续、追逐或空间关系需要清楚传达。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
      - "knowledge/06_连续性与安全规则.md"
    source_rules:
      - "21:R-029"

  - id: "CONT-CAST-ACTIVE-001"
    title: "当前戏份角色过滤"
    owner_agent: "prompt_compiler"
    agent_scope: ["story_planner", "shot_director", "prompt_compiler", "quality_inspector"]
    priority: "P1"
    applies_when: "上一段尾帧、prev_tailframe、视频分析、参考图或 reference 中有当前片段 source_script_events 未包含的人物；质检发现无戏份角色被继续保留或错误绑定参考图。"
    instruction: "尾帧可见人物不等于当前戏份人物；无当前动作/台词的人不得调用参考图，不得保留为门外、侧后方、前景、背景或画外声，应退出画面或不出现。"
    avoid_when: "该人物在当前 source_script_events 或 main_shots 中有明确动作、台词、受击或关系功能。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/17_结果质检与回溯修正规则.md"
    source_rules:
      - "06:规则12-1"
      - "07:规则10-4"
      - "17:检查项9"

  - id: "CONT-STATE-CONTRACT-001"
    title: "片段状态合同"
    owner_agent: "story_planner"
    priority: "P1"
    applies_when: "每个 10-15 秒导演片段、逐段续接、多人调度、门/车/道具状态变化。"
    instruction: "每个片段必须输出 active_cast、offscreen_cast 和 state_contract；state_contract 至少包含 entry_state、exit_state、object_state_transitions、forbidden_continuity，并且下游不得改写。"
    avoid_when: "无例外；即使没有退场人物，也应显式写 offscreen_cast: []。"
    source_files:
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/17_结果质检与回溯修正规则.md"
    source_rules:
      - "05:规则08-1"
      - "06:规则00"
      - "07:规则10-1-1"
      - "17:检查项8-1"

  - id: "CONT-DOOR-MONOTONIC-001"
    title: "门与阈值状态单调"
    owner_agent: "quality_inspector"
    priority: "P1"
    applies_when: "同一片段中出现电梯门、房门、车门、门缝、闸门等开合状态。"
    instruction: "同一片段内门状态必须单向推进；门尚未合拢时可进入，进入后门继续合拢。不得写已合拢/收窄后重新打开、再次打开或被冲开，除非原剧本明确要求。"
    avoid_when: "原剧本明确写了阻门、按开门键、门被挡住或门重新打开。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/17_结果质检与回溯修正规则.md"
    source_rules:
      - "06:规则12-2"
      - "07:规则10-3"
      - "17:检查项10"

  - id: "REF-TAILFRAME-PRIORITY-001"
    title: "尾帧图优先继承"
    owner_agent: "prompt_compiler"
    agent_scope: ["prompt_compiler", "quality_inspector"]
    priority: "P1"
    applies_when: "逐段生成时存在上一段尾帧图、prev_tailframe、自动抽取尾帧或用户补充尾帧截图；质检发现全局风格图、场景图或角色参考图覆盖了尾帧首帧锚点。"
    instruction: "最终 prompt 应直接调用 @图片N（上一段尾帧图）作为首帧、场景、构图、光线和空间锚点；不要长篇复述尾帧内容。若尾帧图已覆盖主要场景，不再重复调用单独场景参考图。"
    avoid_when: "下一段进入尾帧图外的新空间，或用户明确要求重新使用独立场景参考图。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "06:规则12-1-1"
      - "07:规则07-2"
      - "07:规则24"

  - id: "REVERSE-OTS-001"
    title: "外反拍 OTS 用法"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "双人关系推进、冲突对抗、信息交换。"
    instruction: "使用过肩镜头交替，在保留关系空间的同时推进对话。"
    avoid_when: "关系已经决裂、人物孤立感成为重点。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "21:R-030"

  - id: "REVERSE-SINGLE-002"
    title: "内反拍单人镜头用法"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "情感决裂、冷战、孤独感或主观封闭。"
    instruction: "剔除前景遮挡，使用单人镜头将角色从关系空间中抽离。"
    avoid_when: "对话关系仍需被观众持续感知。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "21:R-031"

  - id: "CUT-REACTION-001"
    title: "反应切出 Reaction Cut"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "对白过长、剪辑存在跳跃、需要强调听者受击或关系变化。"
    instruction: "剪辑遮挡型听者特写控制在 1-1.5 秒；剧情受击或信息炸点型遵守至少 1.5 秒，通常 1.5-2.5 秒。"
    avoid_when: "听者没有真实信息变化，或反应镜头会打断动作连续。"
    conflicts_with:
      - "RHYTHM-REACTION-MIN-001"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "21:R-034"

  - id: "CUT-BROLL-002"
    title: "空镜留白 B-roll Cutaway"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "敏感、暴力、不可直接表现或需要观众脑补的高潮动作。"
    instruction: "在高潮动作即将发生时切到空镜 2-3 秒，用声响、环境反应或物体变化承接。"
    avoid_when: "关键信息必须被直接看见，或空镜会造成叙事误解。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "21:R-035"

  - id: "TEXT-PROP-001"
    title: "道具伏笔预埋"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "关键道具后续将触发反转、证明身份、造成危险或承接情感。"
    instruction: "在剧本改写时插入关键道具极简特写，通常约 1 秒，不打断对白主线。"
    avoid_when: "道具没有后续回收价值。"
    source_files:
      - "knowledge/09_节奏总控与剧本改写规则.md"
    source_rules:
      - "09:R-016"

  - id: "RHYTHM-INFO-001"
    title: "关键信息前置"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "目标物、证据、危险或空间关系需要让观众先于角色知道。"
    instruction: "在角色抵达或发现前，先给目标物特写，让观众视角领先角色。"
    avoid_when: "悬念依赖观众和角色同时发现。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:R-07"

  - id: "TRANS-SIGHTLINE-001"
    title: "视线引导转场"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "角色视线可自然引出下一空间或下一信息。"
    instruction: "角色视线、同方向空镜、角色反应三步衔接，保持视线方向一致。"
    avoid_when: "下一镜信息与角色视线无因果关系。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "21:R-036"

  - id: "TRANS-ANCHOR-002"
    title: "特写锚点转场"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "需要用手部、脚部或道具特写完成时空切换。"
    instruction: "用脚步、手部、门把、杯子等可识别特写作为时空转换锚点。"
    avoid_when: "特写物和下一场没有动作或语义关联。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "21:R-037"

  - id: "TRANS-CAUSE-004"
    title: "因果关联转场"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "A 场景动作可以触发 B 场景结果。"
    instruction: "A 场景触发动作后，瞬间切到 B 场景承接结果，让剪辑形成因果链。"
    avoid_when: "两场之间不存在清晰因果，容易误导观众。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "21:R-039"

  - id: "MOTION-PSY-001"
    title: "稳/晃心理映射"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "需要通过运镜稳定性表现心理优势或劣势。"
    instruction: "优势方用稳定推/拉或固定镜头，劣势方可用手持晃动，但晃动不得破坏主体可读性。"
    avoid_when: "同一片段已经有快速动作、复杂环境或模型稳定性风险。"
    source_files:
      - "knowledge/21_镜头调用规则与多机位模板.md"
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "21:R-041"

  - id: "RHYTHM-PUSHPULL-001"
    title: "叙事推拉呼吸感"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "对白、沉默和心理距离需要形成呼吸式节奏。"
    instruction: "对白推进时可提示缓慢推近，情绪撤退或关系疏离时可提示缓慢拉远。"
    avoid_when: "镜头本身已经承担复杂动作或空间交代。"
    source_files:
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "15:R-08"

  - id: "TEXT-SLOWMO-001"
    title: "升格定格情绪留白"
    owner_agent: "rhythm_rewrite_director"
    priority: "P3"
    applies_when: "高潮顶点、情绪爆点或关系断裂需要停顿。"
    instruction: "在剧本层提示慢动作、定格或动静对比，给镜头导演留出情绪留白空间。"
    avoid_when: "信息仍需快速交代，或慢动作会削弱喜剧/反转节奏。"
    source_files:
      - "knowledge/09_节奏总控与剧本改写规则.md"
    source_rules:
      - "09:R-017"

  - id: "FRAME-FOCAL-001"
    title: "焦段服务戏剧目的"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "需要选择广角、标准、人像或长焦表达空间、关系、压迫或观察感。"
    instruction: "内部可用焦段矩阵判断，但最终镜头选择必须服务戏剧目的，避免只为风格而风格。"
    avoid_when: "焦段选择会破坏主体清晰度、空间连续性或模型稳定性。"
    source_files:
      - "knowledge/02_焦段景深与景别画幅策略.md"
    source_rules:
      - "02:焦段叙事决策矩阵"
      - "02:规则03"

  - id: "FRAME-DOF-002"
    title: "景深信息优先级"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "需要决定背景信息是否保留、虚化或作为关系层次。"
    instruction: "背景有叙事信息时保留深景深；需要隔离人物情绪时使用浅景深；标准人物表达优先前清后虚。"
    avoid_when: "背景包含必须被看清的证据、危险或空间关系时，不得为美感过度虚化。"
    source_files:
      - "knowledge/02_焦段景深与景别画幅策略.md"
    source_rules:
      - "02:2.1-2.3"

  - id: "FRAME-ASPECT-001"
    title: "16:9 默认景别策略"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "输出画幅为 16:9，场景需要空间关系、双人关系或横向调度。"
    instruction: "16:9 默认优先中景、中近景和双人关系构图，用横向空间交代关系、距离和环境。"
    avoid_when: "情绪受击或信息炸点需要短暂特写承接。"
    source_files:
      - "knowledge/02_焦段景深与景别画幅策略.md"
    source_rules:
      - "02:16:9画幅规则"

  - id: "FRAME-ASPECT-002"
    title: "9:16 默认景别策略"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "输出画幅为 9:16，人物表现和竖向空间占主导。"
    instruction: "9:16 默认优先半身、中近景和人物竖向关系；避免横向多人关系硬塞导致主体过小。"
    avoid_when: "必须交代完整空间、群戏位置或动作路径时，应短暂使用更宽景别建立关系。"
    source_files:
      - "knowledge/02_焦段景深与景别画幅策略.md"
    source_rules:
      - "02:9:16画幅规则"

  - id: "FRAME-CU-LIMIT-003"
    title: "竖屏特写限频"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "9:16 片段中需要使用面部特写或局部特写。"
    instruction: "特写必须服务受击、信息揭示或情绪锚点，不得把竖屏默认拍成连续大特写。"
    avoid_when: "同一片段特写已经密集，优先改用半身、局部动作或构图压迫表达。"
    source_files:
      - "knowledge/02_焦段景深与景别画幅策略.md"
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "02:特写限频规则"

  - id: "CUT-HIERARCHY-001"
    title: "主分镜职责边界"
    owner_agent: "story_planner"
    priority: "P2"
    applies_when: "需要判断一个动作段、发言单元或事件是否升级为新的主分镜。"
    instruction: "主分镜负责片段骨架和叙事任务，只有叙事关系、动作段或事件功能变化时才升级。"
    avoid_when: "只是景别变化、角度变化或短反应镜头，应留在子分镜层。"
    source_files:
      - "knowledge/03_镜头切换与推进规则.md"
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
    source_rules:
      - "03:规则01"
      - "05:规则06"

  - id: "CUT-SUBSHOT-002"
    title: "子分镜职责边界"
    owner_agent: "shot_director"
    priority: "P2"
    applies_when: "同一主分镜内部需要景别、角度、反应或细节变化。"
    instruction: "子分镜只承担同一动作段内的信息强调，不得切散完整台词、完整动作或主分镜骨架。"
    avoid_when: "子分镜变化会让观众误以为空间或事件发生了新段落。"
    source_files:
      - "knowledge/03_镜头切换与推进规则.md"
    source_rules:
      - "03:规则02"
      - "03:规则07"

  - id: "CUT-TRIGGER-003"
    title: "切主分镜必须有叙事触发"
    owner_agent: "story_planner"
    priority: "P2"
    applies_when: "需要新增主分镜或跨主分镜切换。"
    instruction: "只有叙事需要、动作段转换、信息落点、关系变化或空间任务变化时才切主分镜。"
    avoid_when: "单纯为了镜头丰富、节奏快或换景别而新增主分镜。"
    source_files:
      - "knowledge/03_镜头切换与推进规则.md"
    source_rules:
      - "03:规则04"
      - "03:规则12"

  - id: "CUT-DIALOGUE-004"
    title: "对白镜头不按说话人机械切"
    owner_agent: "shot_director"
    priority: "P4"
    applies_when: "双人或多人对白需要分配镜头。"
    instruction: "对白镜头应按信息落点、权力变化和听者反应分配，而不是谁说话就切谁。"
    avoid_when: "需要极清晰交代发言身份的新人物首次发言。"
    source_files:
      - "knowledge/03_镜头切换与推进规则.md"
      - "knowledge/04_对白与表演镜头规则.md"
    source_rules:
      - "03:规则09"

  - id: "CUT-DOUBLEIMPACT-005"
    title: "双重炸点分两次切落点"
    owner_agent: "shot_director"
    priority: "P3"
    applies_when: "同一片段出现两个独立信息炸点或情绪炸点。"
    instruction: "双重炸点必须分两次组织落点，避免把两个反应压成一个镜头或一句解释。"
    avoid_when: "第二个信息只是第一个信息的补充说明，不构成独立炸点。"
    source_files:
      - "knowledge/03_镜头切换与推进规则.md"
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "03:规则11"

  - id: "SEG-LAYER-001"
    title: "15 秒是片段层不是单分镜层"
    owner_agent: "story_planner"
    priority: "P0"
    applies_when: "需要规划 15 秒片段、主分镜和子分镜关系；15 秒片段不是单分镜层，不能按时间均分，完整发言不能在句中被片段边界截断。"
    instruction: "15 秒片段是生成与叙事片段层，可以包含多个主分镜或子分镜；不要按秒数机械均分，不得把每个镜头都强拆成独立 15 秒，完整发言不能被边界切断。"
    avoid_when: "单个动作或发言本身已经无法在一个生成片段内稳定完成。"
    source_files:
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
    source_rules:
      - "05:规则01"

  - id: "SEG-NOT-EQUAL-002"
    title: "片段不是时间均分块"
    owner_agent: "story_planner"
    priority: "P2"
    applies_when: "需要把剧本拆成多个 15 秒左右的片段。"
    instruction: "片段边界必须围绕戏剧完整性、动作段和发言单元微调，而不是机械按秒数或字数均分。"
    avoid_when: "没有明显戏剧边界时，可用时间上限作为辅助约束，但不能反向切断完整表达。"
    source_files:
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "05:规则02"
      - "15:规则06"

  - id: "SEG-UTTERANCE-003"
    title: "完整发言单元优先"
    owner_agent: "story_planner"
    priority: "P2"
    applies_when: "对白、命令、质问或信息揭示跨越片段边界附近。"
    instruction: "完整发言单元不能在句中被截断；边界应优先避开发言中段。"
    avoid_when: "发言本身过长且存在自然语义分层，可在语义层断开。"
    source_files:
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
    source_rules:
      - "05:规则04"
      - "05:规则09"

  - id: "SEG-ACTION-004"
    title: "片段内镜头数量由内容决定"
    owner_agent: "story_planner"
    priority: "P0"
    applies_when: "需要判断片段内部应该有多少镜头、主分镜、子分镜或反应镜头；15 秒导演片段、单层时间轴、0-3 秒、3-5 秒、5-8 秒、外层动作单元、内层子时间轴容易被嵌套拆分。"
    instruction: "片段内镜头数量服从动作段、信息落点和情绪节拍，不得以固定镜头数模板替代内容判断；保持单层时间轴，不在主分镜下再嵌套子时间轴。"
    avoid_when: "生成模型稳定性要求片段必须降复杂度时，优先减少子分镜而不是破坏片段边界。"
    source_files:
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
    source_rules:
      - "05:规则08"

  - id: "SEG-TAILFRAME-005"
    title: "尾帧静帧不反向改拆片"
    owner_agent: "story_planner"
    priority: "P2"
    applies_when: "逐段生成后拿到上一段尾帧或尾帧分析。"
    instruction: "尾帧只服务下一段续接，不得反向重算已锁定的拆片骨架、主分镜边界或发言单元。"
    avoid_when: "尾帧暴露严重生成失败，必须由 quality_inspector 发起返工。"
    source_files:
      - "knowledge/05_剧本拆分与15秒片段规划规则.md"
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "05:规则15-1"
      - "18:规则08"

  - id: "SCENE-INPUT-CARD-001"
    title: "场景分析九层输入卡必填"
    owner_agent: "scene_analyst"
    priority: "P0"
    applies_when: "scene_analyst 面对任何新剧本或新场景，需在下游启动前固定输入。"
    instruction: "必须完整输出任务 / 戏剧 / 动作 / 运镜 / 空间 / 状态 / 光线与风格 / 参考资产 / 约束 九层输入卡；缺失字段显式标 null 并在 unresolved 数组里列出。"
    avoid_when: "不得直接输出具体景别、机位或运镜，也不得跳过 unresolved 直接给 story_planner 交付。"
    source_files:
      - "knowledge/11_场景分析输入卡与导演意图提取.md"
      - "knowledge/rules/scene_analyst/SCENE-INPUT-CARD-001.md"
    source_rules:
      - "11:全文"

  - id: "SCENE-REF-IMAGE-BINDING-001"
    title: "参考图到角色空间尾帧强绑定"
    owner_agent: "scene_analyst"
    priority: "P0"
    applies_when: "scene_analyst 收到任意参考图（主角身份、对手身份、空间关系、场景空间、上一镜尾帧）。"
    instruction: "每张参考图必须显式绑定到 hero_id / rival_id / position_map / space_map / prev_tailframe 之一，并填齐 image_id、target_id、first_appearance_segment、scope 字段。"
    avoid_when: "不得仅标注'用于参考'或跨片段滥用 prev_tailframe；不得在 scene_analyst 阶段改写图内容。"
    source_files:
      - "knowledge/11_场景分析输入卡与导演意图提取.md"
      - "knowledge/rules/scene_analyst/SCENE-REF-IMAGE-BINDING-001.md"
      - "knowledge/rules/prompt_compiler/REF-TAILFRAME-PRIORITY-001.md"
      - "knowledge/rules/prompt_compiler/REFERENCE-ROLE-STRICT-001.md"
    source_rules:
      - "11:H层"

  - id: "SCENE-CONSISTENCY-LOCK-001"
    title: "场景一致性锁写入 state_contract"
    owner_agent: "scene_analyst"
    priority: "P1"
    applies_when: "scene_analyst 给出场景输入卡时同步初始化 state_contract 前置状态。"
    instruction: "必须产出 scene_lock，锁定 wardrobe / props / lighting / time_of_day / axis / gaze_network 六组字段，供 story_planner 复制为片段 entry_state。"
    avoid_when: "不得留空任一组字段；不得输出互相矛盾的锁值；无剧本或参考图支撑的细节必须标 inferred=true。"
    source_files:
      - "knowledge/11_场景分析输入卡与导演意图提取.md"
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/rules/scene_analyst/SCENE-CONSISTENCY-LOCK-001.md"
      - "knowledge/rules/shared/CONT-STATE-CONTRACT-001.md"
    source_rules:
      - "06:规则03"
      - "11:E层"
      - "11:F层"
      - "11:G层"

  - id: "SCENE-REF-MISSING-FALLBACK-001"
    title: "参考图缺失时的降级协议"
    owner_agent: "scene_analyst"
    priority: "P1"
    applies_when: "某个 subject_id 或 scene_id 没有匹配的参考图。"
    instruction: "必须输出降级卡：no_reference_image=true、identity_description（6 项身份锚点）、first_frame_lock、allowed_style（项目白名单）、extra_constraints（不生成额外人物等）、need_supplement 补图清单。"
    avoid_when: "不得跳过降级让下游自由生成；身份描述不得只给'一名年轻女性'式开放描述；风格不得外扩到非白名单词。"
    source_files:
      - "knowledge/11_场景分析输入卡与导演意图提取.md"
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/rules/scene_analyst/SCENE-REF-MISSING-FALLBACK-001.md"
      - "knowledge/rules/prompt_compiler/REFERENCE-ROLE-STRICT-001.md"
    source_rules:
      - "11:H层"
      - "11:I层"

  - id: "CONT-SCENE-001"
    title: "新场景先做场面总控"
    owner_agent: "scene_analyst"
    priority: "P1"
    applies_when: "新场景没有参考图、空间关系或人物站位尚未建立。"
    instruction: "必须先建立场面总控，明确空间、人物位置、关系、光线和关键道具，再进入分镜。"
    avoid_when: "同场景已有参考图或上一段尾帧可稳定继承。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
    source_rules:
      - "06:规则01"
      - "06:规则03"

  - id: "CONT-SPACE-002"
    title: "切镜不等于重建空间"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "同一场景内切近景、特写、反应或反打。"
    instruction: "切镜只改变观看角度，不得重建人物关系、空间布局、道具位置或对象锚点。"
    avoid_when: "明确进入新场景或时间跳跃，并由 story_planner 标注边界。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
    source_rules:
      - "06:规则05"
      - "06:规则07"

  - id: "CONT-AXIS-003"
    title: "建立后必须守轴"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "首次建立人物关系、视线方向或动作轴线后。"
    instruction: "后续镜头必须维护轴线和视线对象关系，反打镜头也要保住原场面关系。"
    avoid_when: "只有幻觉、精神错乱或梦境等异常心理场景允许注册为越轴例外。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/21_镜头调用规则与多机位模板.md"
    source_rules:
      - "06:规则08"
      - "06:规则10"

  - id: "CONT-ACTION-004"
    title: "动作接续落到具体身体部位"
    owner_agent: "shot_director"
    priority: "P1"
    applies_when: "动作跨镜头、切特写或局部承接前镜动作。"
    instruction: "必须写清手、脚、眼神、身体重心或道具的接续关系，避免笼统说继续动作。"
    avoid_when: "动作已经在上一主分镜结束，并进入新的独立事件。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/14_动作描述精细化控制规则.md"
    source_rules:
      - "06:规则11"
      - "06:规则12"

  - id: "CONT-PROP-005"
    title: "道具和光线状态默认延续"
    owner_agent: "quality_inspector"
    priority: "P1"
    applies_when: "同一场景跨镜头或跨片段持续出现道具、服装、光线和环境状态。"
    instruction: "道具持有方式、摆放位置、开关状态、光线方向和强弱默认延续，除非剧本明确发生改变。"
    avoid_when: "存在明确时间跳跃、空间切换或角色主动改变道具状态。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "06:规则13"
      - "06:规则14"
      - "18:规则16"

  - id: "SAFETY-INTIMACY-001"
    title: "私密场景看情绪不看身体"
    owner_agent: "quality_inspector"
    priority: "P0"
    applies_when: "亲密、暧昧、身体接触、脆弱姿态或容易滑向身体凝视的场景。"
    instruction: "镜头必须服务情绪、关系和叙事动机，不以身体部位作为观看目的。"
    avoid_when: "身体部位没有清晰叙事动机或会造成不必要凝视。"
    source_files:
      - "knowledge/06_连续性与安全规则.md"
    source_rules:
      - "06:规则15"
      - "06:规则16"

  - id: "PROMPT-STRUCT-001"
    title: "最终 Seedance prompt 输出结构必须是可执行导演指令"
    owner_agent: "prompt_compiler"
    priority: "P1"
    applies_when: "将上游分镜编译成 Seedance 提示词；需要最终输出结构、单层时间轴、一镜一主动作、多人同句去歧义。"
    instruction: "最终输出必须是 Seedance 可直接生成的自然中文导演 prompt：按角色参考总控、空间与首帧总控、时间轴、约束、参考调用组织；时间轴每段先写主体、景别、机位、空间，再写一镜一主动作；关键动作后补表情锚点；多人同句必须写角色名，不用歧义代词；不得输出分析报告、关键词串或表单。"
    avoid_when: "内部推理、诊断或知识库维护场景。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "07:规则01"
      - "07:规则11"

  - id: "PROMPT-TIMEZERO-002"
    title: "单独片段时间轴从 0 秒开始"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "编译单个生成片段的时间轴。"
    instruction: "每个独立生成片段的时间轴都从 0 秒开始，不继承全片绝对时间。"
    avoid_when: "输出全片级时间表或剪辑总表。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "07:规则03"

  - id: "PROMPT-REF-003"
    title: "参考图先绑定再进时间轴"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "存在人物参考图、场景参考图、尾帧或视频参考。"
    instruction: "人物参考图先绑定身份和外观，场景参考图只负责环境空间；参考调用放在合适位置，不得污染场景主体。"
    avoid_when: "没有参考图或参考图与当前片段无关。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "07:规则04"
      - "07:规则05"
      - "07:规则08"

  - id: "PROMPT-FIRSTFRAME-004"
    title: "首帧继承优先级"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "使用上一段尾帧、静帧或参考图续接下一段。"
    instruction: "首帧继承只负责延续人物、道具、空间和光线，不得重写上游拆片边界。"
    avoid_when: "上一段生成失败或尾帧与剧本目标严重偏离。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/18_情绪锚点与逐段交互与仰拍限制补丁.md"
    source_rules:
      - "07:规则07"
      - "07:规则07-1"

  - id: "PROMPT-SHOTBASE-005"
    title: "每个时间段先立分镜基底"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "编译时间轴内的每个主分镜或时间段。"
    instruction: "每个时间段必须先用自然语言建立主体、景别、机位、空间和动作基底，再写子分镜变化。"
    avoid_when: "已经处在同一时间段内部的连续子动作，不需要重复完整基底。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
    source_rules:
      - "07:规则09"
      - "07:规则09-1"

  - id: "PROMPT-ACTION-006"
    title: "一镜一主动作"
    owner_agent: "prompt_compiler"
    priority: "P0"
    applies_when: "编译一个镜头句、Seedance prompt 或连续生成片段；同一句堆叠起身、转身、走到门口、回头说话、连续动作、关键动作、表情锚点或视线锚点。"
    instruction: "同一镜头只写一个主动作；不要把起身、转身、走到门口、回头说话全部塞进同一镜，多人同句时避免歧义代词，并在关键动作后补表情/视线锚点。"
    avoid_when: "群戏需要同时呈现背景群体动作时，主动作仍需单独突出。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/22_多机位分镜与镜头多样性规则.md"
    source_rules:
      - "07:规则11-1"
      - "07:规则11-2"
      - "07:规则11-3"

  - id: "PROMPT-MOTION-007"
    title: "摄影机运动与主体动作分句"
    owner_agent: "prompt_compiler"
    priority: "P5"
    applies_when: "提示词里同时存在角色动作和摄影机运动。"
    instruction: "摄影机运动和主体动作必须分句，运镜模态写清，不得把推、拉、摇、移、跟随混成模糊动作团。"
    avoid_when: "固定机位场景，应明确写固定或轻微稳定，而不是硬加运镜。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
      - "knowledge/15_故事节奏控制规则.md"
    source_rules:
      - "07:规则11-4"
      - "07:规则11-5"
      - "07:规则08-16"

  - id: "PROMPT-FAST-008"
    title: "禁止三快叠加"
    owner_agent: "prompt_compiler"
    priority: "P1"
    applies_when: "提示词里出现快速主体动作、快速运镜、复杂环境或高强度剪辑。"
    instruction: "快只能快一个维度；不得同时让主体动作快、摄影机快、环境复杂度高。"
    avoid_when: "无例外；若必须表现混乱，优先降低环境复杂度或改用短反应/空镜承接。"
    source_files:
      - "knowledge/07_Seedance输出词典与模型适配.md"
