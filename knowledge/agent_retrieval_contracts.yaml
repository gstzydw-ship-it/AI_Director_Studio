version: "2026-05-06"
status: active
runtime_retrieval: false
purpose: "Define recommended knowledge/case retrieval tag contracts for director agents."

precedence:
  rule_cards_first: true
  case_cards_role: "reference_patterns_only"
  conflict_policy: "When a case card conflicts with a P0/P1 rule card, the P0/P1 rule overrides the case. Case cards may only fill style, pattern, and example gaps after rule constraints are satisfied."
  priority_order:
    - P0_user_explicit_and_safety
    - P1_continuity_and_model_generability
    - P2_fragment_boundary_and_storyboard_legality
    - P3_rhythm_and_rewrite_quality
    - P4_shot_language_and_visual_execution
    - P5_cases_examples_and_source_material

tag_fields:
  agent_scope: "Required agent ownership tag. Match exact agent first, then shared."
  rule_type: "Functional rule category, for example continuity, segmentation, rhythm, shot_language, prompt_output, safety, quality."
  priority_policy: "Priority tier filter and conflict policy."
  scene_types: "Narrative/spatial scene categories recommended for the agent."
  events: "Dramatic or physical events recommended for the agent."
  risks: "Failure modes the agent should actively retrieve guardrails for."
  dialogue_types: "Dialogue patterns relevant to the agent."
  aspect_ratios: "Frame/aspect constraints relevant to the agent."
  signals: "Runtime textual or structured cues that should boost retrieval."

global_matching_strategy:
  include_agent_scope:
    - "{agent_name}"
    - shared
  exclude_status:
    - deprecated
    - draft_unless_explicitly_requested
  retrieval_order:
    - "P0/P1 rule cards matching agent_scope and signals."
    - "P2-P4 rule cards matching rule_type, scene_types, events, risks, dialogue_types, or aspect_ratios."
    - "P5 case cards matching the same tags, used as examples rather than binding instructions."
  case_card_limits:
    max_share_of_context: 0.35
    require_rule_anchor: true
    instruction: "Every retrieved case should be paired with at least one relevant active rule card when available."

agents:
  scene_analyst:
    agent_scope:
      primary:
        - scene_analyst
      secondary:
        - shared
    rule_type:
      prefer:
        - scene_analysis
        - intent_extraction
        - character_relation
        - spatial_parsing
        - continuity
        - safety
      avoid_as_primary:
        - prompt_output
        - final_shot_execution
    priority_policy:
      prefer:
        - P0
        - P1
        - P2
      use_cases_after_rules: true
      conflict_policy: "Do not let a case reinterpret explicit story facts, safety constraints, character identity, or spatial continuity."
    scene_types:
      match:
        - interior
        - exterior
        - dialogue_scene
        - action_scene
        - suspense_scene
        - emotional_turning_point
        - multi_character_scene
        - constrained_space
    events:
      match:
        - entrance_exit
        - discovery
        - confrontation
        - pursuit
        - physical_contact
        - emotional_reversal
        - object_handoff
    risks:
      match:
        - ambiguous_subject
        - missing_location
        - unclear_time_order
        - identity_drift
        - continuity_break
        - unsafe_or_unfilmable_action
    dialogue_types:
      match:
        - exposition
        - conflict_dialogue
        - subtext
        - group_dialogue
        - silence_or_pause
    aspect_ratios:
      match:
        - any
      note: "Only use aspect_ratio tags to identify spatial constraints; do not make final framing decisions."
    signals:
      boost:
        - "who is present"
        - "where it happens"
        - "relationship change"
        - "intent"
        - "space layout"
        - "continuity anchor"
        - "risk"

  rhythm_rewrite_director:
    agent_scope:
      primary:
        - rhythm_rewrite_director
      secondary:
        - story_planner
        - shared
    rule_type:
      prefer:
        - rhythm
        - rewrite
        - dramatic_beats
        - action_detail
        - emotion_anchor
        - dialogue_performance
      avoid_as_primary:
        - prompt_output
        - lens_execution
    priority_policy:
      prefer:
        - P0
        - P1
        - P3
      use_cases_after_rules: true
      conflict_policy: "Rewrite may compress, sharpen, or reorder expression, but must not override P0/P1 factual continuity, safety, or user constraints."
    scene_types:
      match:
        - emotional_turning_point
        - action_scene
        - suspense_scene
        - dialogue_scene
        - transition_scene
        - climax
    events:
      match:
        - beat_change
        - escalation
        - hesitation
        - reveal
        - reversal
        - interruption
        - decision
    risks:
      match:
        - overlong_fragment
        - weak_action_peak
        - flat_emotion
        - dialogue_exposition_dump
        - missing_beat_boundary
        - invented_story_fact
    dialogue_types:
      match:
        - conflict_dialogue
        - emotional_dialogue
        - subtext
        - rapid_exchange
        - interrupted_dialogue
        - monologue
    aspect_ratios:
      match:
        - any
      note: "Aspect ratio is only a light signal for pacing density and vertical-screen expression."
    signals:
      boost:
        - "15 seconds"
        - "pace"
        - "rewrite"
        - "emotion"
        - "action peak"
        - "dramatic beat"
        - "dialogue tension"

  story_planner:
    agent_scope:
      primary:
        - story_planner
      secondary:
        - rhythm_rewrite_director
        - shot_director
        - shared
    rule_type:
      prefer:
        - segmentation
        - story_structure
        - fragment_boundary
        - continuity
        - main_shot_skeleton
        - rhythm
      avoid_as_primary:
        - final_prompt_output
    priority_policy:
      prefer:
        - P0
        - P1
        - P2
        - P3
      use_cases_after_rules: true
      conflict_policy: "Fragment boundaries and continuity anchors from P0/P1/P2 rules override case-derived pacing patterns."
    scene_types:
      match:
        - dialogue_scene
        - action_scene
        - travel_or_transition
        - suspense_scene
        - multi_location_scene
        - climax
    events:
      match:
        - entrance_exit
        - scene_transition
        - beat_change
        - action_peak
        - reveal
        - decision
        - object_handoff
    risks:
      match:
        - overlong_fragment
        - undercovered_event
        - missing_opening_or_closing_image
        - illegal_time_jump
        - continuity_break
        - too_many_events_in_fragment
    dialogue_types:
      match:
        - dialogue_exchange
        - monologue
        - overlapping_dialogue
        - silence_or_pause
        - offscreen_dialogue
    aspect_ratios:
      match:
        - "9:16"
        - "16:9"
        - "1:1"
      note: "Use aspect_ratio tags for fragment planning density and vertical-screen constraints."
    signals:
      boost:
        - "fragment"
        - "15s"
        - "opening image"
        - "closing image"
        - "event coverage"
        - "time budget"
        - "main shots"

  shot_director:
    agent_scope:
      primary:
        - shot_director
      secondary:
        - story_planner
        - prompt_compiler
        - shared
    rule_type:
      prefer:
        - shot_language
        - camera_blocking
        - composition
        - lens
        - transition
        - continuity
        - model_generability
      avoid_as_primary:
        - script_rewrite
    priority_policy:
      prefer:
        - P0
        - P1
        - P2
        - P4
      use_cases_after_rules: true
      conflict_policy: "Shot cases can suggest coverage patterns, but P0/P1/P2 continuity, legal fragment boundaries, and explicit user constraints remain binding."
    scene_types:
      match:
        - dialogue_scene
        - action_scene
        - suspense_scene
        - emotional_turning_point
        - constrained_space
        - multi_character_scene
        - vertical_screen_scene
    events:
      match:
        - action_peak
        - reaction
        - entrance_exit
        - gaze_shift
        - physical_contact
        - reveal
        - transition
    risks:
      match:
        - axis_break
        - jump_cut
        - missing_reaction_coverage
        - impossible_camera_move
        - poor_model_generability
        - occluded_subject
        - aspect_ratio_mismatch
    dialogue_types:
      match:
        - shot_reverse_shot
        - two_person_conflict
        - group_dialogue
        - offscreen_dialogue
        - reaction_pause
    aspect_ratios:
      match:
        - "9:16"
        - "16:9"
        - "2.39:1"
        - "1:1"
      note: "Aspect ratio should strongly affect composition, subject placement, headroom, and coverage density."
    signals:
      boost:
        - "shot"
        - "camera"
        - "angle"
        - "coverage"
        - "reaction"
        - "transition"
        - "axis"
        - "composition"

  prompt_compiler:
    agent_scope:
      primary:
        - prompt_compiler
      secondary:
        - shot_director
        - quality_inspector
        - shared
    rule_type:
      prefer:
        - prompt_output
        - model_adapter
        - seedance_dictionary
        - visual_prompt
        - negative_prompt
        - continuity
        - model_generability
      avoid_as_primary:
        - story_rewrite
        - new_shot_decision
    priority_policy:
      prefer:
        - P0
        - P1
        - P4
      use_cases_after_rules: true
      conflict_policy: "Compiler must translate approved decisions only. Cases may provide phrasing templates, never new story, camera, or continuity decisions when rules already specify them."
    scene_types:
      match:
        - any
        - dialogue_scene
        - action_scene
        - low_light_scene
        - crowded_scene
        - constrained_space
        - vertical_screen_scene
    events:
      match:
        - action_peak
        - reaction
        - gaze_shift
        - object_handoff
        - reveal
        - transition
    risks:
      match:
        - prompt_ambiguity
        - missing_subject
        - unsupported_camera_instruction
        - contradiction
        - identity_drift
        - unsafe_or_unfilmable_action
        - aspect_ratio_mismatch
    dialogue_types:
      match:
        - visible_speaking
        - offscreen_dialogue
        - silence_or_pause
        - reaction_pause
      note: "Dialogue tags should help decide visible performance cues, not generate dialogue not approved upstream."
    aspect_ratios:
      match:
        - "9:16"
        - "16:9"
        - "2.39:1"
        - "1:1"
      note: "Must preserve approved aspect ratio and translate it into concrete framing language."
    signals:
      boost:
        - "final prompt"
        - "Seedance"
        - "model adapter"
        - "negative prompt"
        - "visual detail"
        - "no invention"
        - "continuity token"
        - "aspect ratio"

  quality_inspector:
    agent_scope:
      primary:
        - quality_inspector
      secondary:
        - prompt_compiler
        - shot_director
        - story_planner
        - shared
    rule_type:
      prefer:
        - quality
        - guardrail
        - continuity
        - conflict_resolution
        - model_generability
        - safety
        - output_schema
      avoid_as_primary: []
    priority_policy:
      prefer:
        - P0
        - P1
        - P2
        - P4
      use_cases_after_rules: true
      conflict_policy: "Inspector flags any case-derived recommendation that violates P0/P1 rules, approved story facts, continuity anchors, output schema, or model feasibility."
    scene_types:
      match:
        - any
        - dialogue_scene
        - action_scene
        - suspense_scene
        - multi_character_scene
        - constrained_space
        - vertical_screen_scene
    events:
      match:
        - action_peak
        - transition
        - reaction
        - entrance_exit
        - object_handoff
        - reveal
        - beat_change
    risks:
      match:
        - contradiction
        - continuity_break
        - missing_required_field
        - schema_violation
        - hallucinated_detail
        - poor_model_generability
        - unsafe_or_unfilmable_action
        - aspect_ratio_mismatch
    dialogue_types:
      match:
        - any
        - dialogue_exchange
        - offscreen_dialogue
        - monologue
        - silence_or_pause
    aspect_ratios:
      match:
        - "9:16"
        - "16:9"
        - "2.39:1"
        - "1:1"
      note: "Validate consistency between requested ratio, shot composition, prompt wording, and output schema."
    signals:
      boost:
        - "inspect"
        - "validate"
        - "conflict"
        - "schema"
        - "missing"
        - "contradiction"
        - "continuity"
        - "feasibility"

integration_notes:
  recommended_loader:
    file: "knowledge/agent_retrieval_contracts.yaml"
    behavior: "Load as a retrieval profile layer before querying rule_registry/cases. It should filter or boost candidate cards; it should not replace priority or conflict logic in the rules."
  suggested_code_touchpoints_for_parent_agent:
    - "Knowledge retrieval orchestration where agent_name is known and candidate rule/case cards are ranked."
    - "Rule registry query construction, to add agent_scope/rule_type/tag boosts."
    - "Case retrieval merge step, to cap case-card context and attach rule anchors."
    - "Quality/conflict arbitration step, to enforce P0/P1 rule-over-case precedence."
